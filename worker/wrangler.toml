name = "lds-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# the GitHub Pages address of the site, e.g. "https://yourname.github.io" (several: comma separated)
SITE_ORIGIN = "https://lateraldriftseries.github.io"
# your own SteamID64 (17 digits): this account is always an admin
OWNER_STEAM_IDS = "76561199231338901"

[[d1_databases]]
binding = "DB"
database_name = "lds"
database_id = "54ab4a1b-0d9f-410f-9db2-5221fe67da90"

# secrets (not in this file):  npx wrangler secret put SESSION_SECRET   /   npx wrangler secret put STEAM_API_KEY
