.seg2 { display: inline-flex; padding: 4px; gap: 4px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--panel) }
.seg2 button { border: 0; border-radius: 3px; padding: .65rem 1.3rem; background: none; color: var(--muted); cursor: pointer; font: 500 .66rem/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; transition: background .25s, color .25s }
.seg2 button:hover { color: var(--text) }
.seg2 button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink) }
.lb-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem }
.lb-card { display: grid; gap: 1.4rem; padding: 1.6rem; transition: transform .3s var(--ease), border-color .3s; animation: rise .5s var(--ease) both }
.lb-card:nth-child(2) { animation-delay: .06s } .lb-card:nth-child(3) { animation-delay: .12s }
.lb-card:hover { transform: translateY(-3px); border-color: var(--line-2) }
.lb-card.place-1 { border-color: var(--accent); background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%), var(--panel) }
.lb-top { display: flex; align-items: center; gap: .8rem }
.lb-place { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 3px; background: var(--panel-2); font: 600 .9rem var(--f-mono); color: var(--text) }
.place-1 .lb-place { background: var(--accent); color: var(--accent-ink) }
.crown { margin-left: auto; width: 20px; height: 20px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linejoin: round }
.lb-who { display: flex; align-items: center; gap: 1rem; min-width: 0 }
.lb-ava { flex: none; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 4px; border: 1px solid var(--line-2); background: var(--panel-2); font: 500 1.05rem var(--f-display); color: var(--text) }
.place-1 .lb-ava { border-color: color-mix(in srgb, var(--accent) 60%, var(--line-2)) }
.lb-who b { font: 600 1.15rem/1.2 var(--f-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.lb-sub { font: 500 .62rem/1.4 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.lb-pts { display: grid; gap: .45rem; padding-top: 1.1rem; border-top: 1px solid var(--line) }
.lb-pts b { font: 500 2rem/1 var(--f-display); letter-spacing: -.04em; color: var(--text) }
.place-1 .lb-pts b { color: var(--accent) }
@media (max-width: 860px) { .lb-grid { grid-template-columns: 1fr } }
.toc .sep:first-child { margin-top: 0 }
.next-date { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap }
.next-date b { font: 500 1.15rem/1 var(--f-display); letter-spacing: -.02em; color: var(--text) }

/* admin motion: section changes slide in, rows follow one by one, active menu item draws its marker, saves confirm with a toast */
@keyframes admIn { from { opacity: 0; transform: translateY(10px) } }
.adm-main.adm-enter > * { animation: admIn .45s var(--ease) both }
.adm-main.adm-enter > :nth-child(3) { animation-delay: .05s } .adm-main.adm-enter > :nth-child(n+4) { animation-delay: .1s }
.adm-enter tbody tr { animation: admIn .4s var(--ease) both; animation-delay: calc(var(--r, 0) * 22ms + .12s) }
.adm-enter .box, .adm-enter .island > *, .adm-enter .rule-ed, .adm-enter .protest { animation: admIn .45s var(--ease) both; animation-delay: .08s }
.adm-side button { position: relative; transition: background .25s, color .25s, padding-left .25s var(--ease) }
.adm-side button::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--accent); transform: scaleY(0); transition: transform .35s var(--ease) }
.adm-side button[aria-pressed="true"] { box-shadow: none } .adm-side button[aria-pressed="true"]::before { transform: scaleY(1) }
.adm-side button:hover { padding-left: 1.1rem }
.clickrow td:last-child { transition: color .25s } .clickrow:hover td:last-child { color: var(--text) }
@keyframes segIn { from { transform: scale(.9) } }
.seg button[aria-pressed="true"], .stepper button.cur, .tabs button[aria-pressed="true"] { animation: segIn .3s var(--ease) }
.toast { position: fixed; right: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60; padding: .75rem 1.1rem; border: 1px solid var(--line-2); border-left: 2px solid var(--accent); border-radius: 4px; background: var(--panel); color: var(--text); font: 500 .8rem var(--f-body); box-shadow: 0 14px 30px -18px #000;
  animation: toastIn .35s var(--ease), toastOut .4s ease 1.7s forwards }
.toast::before { content: "✓ "; color: var(--accent) }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px) } }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px) } }

/* team avatars from uploaded images; the profile shows the same card as the Teams page */
.tlogo.has-img { background-size: cover !important; background-position: center !important; background-repeat: no-repeat !important; color: transparent }
.tc-static { cursor: default } .tc-static:hover { transform: none }
.logo-up { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem }
.logo-up .btn.line { cursor: pointer }

/* team leader tools and invitations */
.lead-tools { display: grid; gap: 1rem; padding: 1.1rem 1.2rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); animation: admIn .4s var(--ease) both }
.lead-row { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem }
.lead-row > .label { min-width: 9.5rem }
.lead-row .field { height: 36px; padding: 0 .7rem }
.chip-inv { display: inline-flex; align-items: center; gap: .35rem; padding: .3rem .35rem .3rem .7rem; border: 1px solid var(--line-2); border-radius: 4px; font-size: .82rem; animation: segIn .3s var(--ease) }
.chip-inv button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 .25rem } .chip-inv button:hover { color: var(--accent) }
.inv-card { border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)) !important; animation: admIn .4s var(--ease) both }
.tlock { margin-left: .4rem; font-size: .8em; opacity: .7 }

/* ================= v4 "telemetry": near-black glass, orange light, thin type, instrument details =================
   Idea: a car's instrument cluster. Hairline grid, a drift-angle gauge, glowing orange arcs and lit edges on dark glass.
   Type: Inter Tight only — light for display and numbers, medium uppercase for labels. Rounded panels, no slants, no mono. */
:root {
  --bg: #050505; --panel: #0b0b0c; --panel-2: #131315; --line: #1c1c1f; --line-2: #2b2b2f;
  --text: #f5f3ef; --muted: #76767d; --soft: #acacb3;
  --accent: #ff6a13; --accent-2: #ffa45e; --accent-ink: #140700;
  --f-display: "Inter Tight", "Segoe UI", system-ui, sans-serif;
  --f-body: var(--f-display); --f-card: var(--f-display); --f-mono: var(--f-display); --f-logo: var(--f-display);
  --r: 18px; --ease: cubic-bezier(.2, .8, .2, 1);
  --glass: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, .012));
  --grad: linear-gradient(135deg, var(--accent-2), var(--accent) 55%, #ff4a00);
}
body { font: 400 16px/1.6 var(--f-body); letter-spacing: -.005em; background: var(--bg) }
::selection { background: var(--accent); color: var(--accent-ink) }
h1, h2 { font-family: var(--f-display); font-weight: 300; font-style: normal; text-transform: none; letter-spacing: -.045em; line-height: 1.02 }
h2 { font-size: clamp(2rem, 4vw, 3.3rem) }
h3 { font-weight: 500; letter-spacing: -.02em }
.label { font: 500 .68rem/1.3 var(--f-body); letter-spacing: .18em; text-transform: uppercase; color: var(--muted) }
.label.acc, .acc, .idx { color: var(--accent) }
.stat b, .lb-pts b, .numshow, .pc-rate b, .cd b, .facts b, .next-date b, .wm { font-family: var(--f-display) !important; font-weight: 300 !important; font-style: normal !important; letter-spacing: -.04em !important }
.who h1, .tdetail-head h3, .tcard h3, .prose h3, .intro-lead h2, .tierline b { font-family: var(--f-display) !important; font-weight: 400 !important; font-style: normal !important; letter-spacing: -.03em !important; text-transform: none }

/* surfaces and controls */
.panel { background: var(--glass), var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04) }
.btn { height: 48px; padding: 0 1.5rem; border: 0; border-radius: 12px; font: 600 .76rem/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); background: var(--grad);
  box-shadow: 0 12px 32px -14px color-mix(in srgb, var(--accent) 85%, transparent), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: transform .25s var(--ease), box-shadow .3s, border-color .25s, color .2s }
.btn:hover { filter: none; background: var(--grad); transform: translateY(-1px); box-shadow: 0 18px 42px -12px color-mix(in srgb, var(--accent) 95%, transparent), inset 0 1px 0 rgba(255, 255, 255, .45) }
.btn.line, .steam { background: rgba(255, 255, 255, .02); color: var(--text); border: 1px solid var(--line-2); box-shadow: none }
.btn.line:hover, .steam:hover { background: rgba(255, 255, 255, .03); border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 12%, transparent) }
.btn.sm { height: 38px; padding: 0 1.05rem; font-size: .68rem; border-radius: 10px }
.btn.text { height: auto; padding: .4rem 0; background: none; box-shadow: none; color: var(--soft); font: 500 .88rem var(--f-body); letter-spacing: 0; text-transform: none }
.btn.text:hover { background: none; color: var(--accent); transform: none; box-shadow: none }
.btn.text.sm { height: auto; padding: .3rem 0 }
.steam { text-transform: none; letter-spacing: 0; font-size: .85rem }
.pill { border-radius: 999px; padding: .42rem .7rem; font: 500 .64rem/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase;
  border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: color-mix(in srgb, currentColor 10%, transparent); text-decoration: none }
.seg2 { padding: 4px; gap: 4px; border: 1px solid var(--line-2); border-radius: 12px; background: rgba(255, 255, 255, .02) }
.seg2 button { border-radius: 9px; font: 500 .64rem/1 var(--f-body); letter-spacing: .16em }
.seg2 button[aria-selected="true"], .tabs button[aria-pressed="true"] { background: var(--grad); color: var(--accent-ink); border-color: transparent }
.tabs button { border-radius: 10px }
.field:focus, textarea:focus, .numcustom input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent) }
.field, textarea, .row input, .numcustom input { border-radius: 10px }
.numgrid button { border-radius: 8px }
.numgrid button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 0 18px -4px var(--accent) }
.tablebox { border-radius: var(--r) }
th { font: 500 .62rem var(--f-body); letter-spacing: .16em; color: var(--muted) }
.n { font: 500 .95rem var(--f-display); color: var(--accent) }
.tcard { position: relative; overflow: hidden; padding: 1.6rem }
.tcard h3 { font-size: 1.5rem !important }
.tcard.current { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 40px -18px var(--accent);
  background: radial-gradient(80% 70% at 100% 100%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%), var(--glass), var(--panel) }
.adm-side button[aria-pressed="true"] { border-radius: 10px }

/* header */
header { background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(18px) saturate(1.2); border-bottom: 1px solid var(--line) }
header.scrolled { background: color-mix(in srgb, var(--bg) 88%, transparent); box-shadow: none }
.bar { padding-block: .9rem }
.logo { gap: .7rem; font: inherit; color: var(--text) }
.logo i { display: none }
.lg-mark, .flogo { display: inline-grid; place-items: center; height: 30px; padding: 0 .6rem; border-radius: 8px; background: var(--grad); color: var(--accent-ink) !important;
  font: 700 .86rem/1 var(--f-display); letter-spacing: .04em; text-decoration: none; box-shadow: 0 0 22px -4px color-mix(in srgb, var(--accent) 70%, transparent) }
.lg-word { font: 400 .78rem/1.1 var(--f-display); letter-spacing: -.01em; color: var(--soft) }
nav { gap: 2.1rem }
nav a { font: 500 .7rem/1 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--soft); padding-block: .5rem; text-shadow: none !important }
nav a::after { left: 50%; right: auto; bottom: -7px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); transform: translateX(-50%) scale(0); transition: transform .3s var(--ease) }
nav a:hover, nav a[aria-current] { color: var(--text) }
nav a:hover::after, nav a[aria-current]::after { transform: translateX(-50%) scale(1) }
.lang { font: 500 .72rem var(--f-body); letter-spacing: .1em; color: var(--line-2) }
.ava { border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font: 500 .9rem var(--f-display) }

/* background: hairline grid fading down, orange bloom top-right, a ribbed light beam on the right edge; the grid lights up orange under the cursor */
.bg { background: var(--bg) }
.bg::before, .spot { background-size: 80px 80px; background-position: center top }
.bg::before { content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
  -webkit-mask-image: radial-gradient(120% 85% at 50% 0%, #000 30%, transparent 85%); mask-image: radial-gradient(120% 85% at 50% 0%, #000 30%, transparent 85%) }
.bg-glow { inset: -10%; background: radial-gradient(50vmax 36vmax at 88% -8%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 70%),
  radial-gradient(40vmax 30vmax at -6% 100%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%); animation: breathe 16s ease-in-out infinite alternate }
.stripes { position: absolute; top: 6vh; right: -16vw; width: 44vw; height: 80vh; opacity: .45;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 60%, transparent), transparent);
  -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 9px, rgba(0, 0, 0, .3) 9px 20px); mask-image: repeating-linear-gradient(90deg, #000 0 9px, rgba(0, 0, 0, .3) 9px 20px);
  transform: translate3d(calc(var(--px) * -24px), calc(var(--sy) * -.06), 0); animation: beam 10s ease-in-out infinite alternate }
@keyframes beam { from { opacity: .28 } to { opacity: .5 } }
.spot { opacity: 0;
  background-image: linear-gradient(color-mix(in srgb, var(--accent) 45%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--accent) 45%, transparent) 1px, transparent 1px);
  -webkit-mask-image: radial-gradient(220px circle at var(--mx) var(--my), #000, transparent 75%); mask-image: radial-gradient(220px circle at var(--mx) var(--my), #000, transparent 75%) }
.grain { opacity: .05 }
@media (max-width: 760px) { .stripes { right: -45vw; width: 95vw; opacity: .25; animation: none } }

/* home: statement and numbers */
.intro4 { display: grid; gap: 2.2rem; padding-top: 1rem }
.statement { margin: 0; max-width: 30ch; font: 300 clamp(1.7rem, 3.4vw, 2.9rem)/1.14 var(--f-display); letter-spacing: -.035em }
.statement span { color: #5d5d64 }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.5rem }
.kpi { position: relative; display: grid; gap: 1rem; padding-top: 1.1rem; border-top: 1px solid var(--line) }
.kpi::before { content: ""; position: absolute; top: -1px; left: 0; width: 28px; height: 2px; background: var(--accent) }
.kpi b { font: 200 clamp(3rem, 6vw, 5rem)/.9 var(--f-display); letter-spacing: -.06em }
@media (max-width: 760px) { .kpis { grid-template-columns: 1fr 1fr } }

/* home: section heads */
.sec { gap: 1.8rem }
.sec-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: .9rem 2rem; padding-bottom: 1.4rem; border-bottom: 1px solid var(--line) }
.sec-head .idx { grid-column: 1 / -1 }
.sec-head h2 { margin: 0 }
.more { display: inline-flex; align-items: center; gap: .8rem; font: 500 .68rem var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--soft); text-decoration: none; transition: color .25s }
.more::after { content: ""; width: 48px; height: 1px; background: var(--line-2); transition: width .4s var(--ease), background .3s }
.more:hover { color: var(--text) } .more:hover::after { width: 72px; background: var(--accent) }

/* home: calendar as tall cards, the current stage lit from below */
.cal { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .8rem }
.cal-card { position: relative; overflow: hidden; display: grid; align-content: space-between; min-height: 250px; padding: 1.2rem; border-radius: var(--r); border: 1px solid var(--line);
  background: var(--glass), var(--panel); text-decoration: none; transition: transform .35s var(--ease), border-color .3s }
.cal-card::after { content: ""; position: absolute; left: -20%; right: -20%; bottom: -45%; height: 75%; background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 75%, transparent), transparent);
  opacity: 0; transition: opacity .4s; pointer-events: none }
.cal-card:hover { transform: translateY(-4px); border-color: var(--line-2) } .cal-card:hover::after { opacity: .3 }
.cal-card.cur { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 40px -16px var(--accent) } .cal-card.cur::after { opacity: .8 }
.cal-card.done { opacity: .5 } .cal-card.done:hover { opacity: .85 }
.cal-n { font: 200 3.2rem/1 var(--f-display); letter-spacing: -.05em; color: var(--soft) } .cal-card.cur .cal-n { color: var(--text) }
.cal-body { position: relative; z-index: 1; display: grid; gap: .35rem }
.cal-body b { font: 500 1.05rem/1.2 var(--f-display); letter-spacing: -.02em }
.cal-body .pill { justify-self: start; margin-top: .35rem }
@media (max-width: 1000px) { .cal { grid-template-columns: repeat(6, minmax(170px, 1fr)); overflow-x: auto; padding-bottom: .6rem; scroll-snap-type: x mandatory } .cal-card { scroll-snap-align: start; min-height: 210px } }

/* home: how to take part */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) }
.steps li + li { border-left: 1px solid var(--line) }
.steps a { display: grid; align-content: start; gap: .55rem; height: 100%; padding: .4rem 1.6rem 1rem; text-decoration: none }
.steps li:first-child a { padding-left: 0 }
.step-ic { width: 46px; height: 46px; display: grid; place-items: center; margin-bottom: .7rem; border: 1px solid var(--line-2); border-radius: 12px; color: var(--accent); transition: border-color .3s, box-shadow .3s }
.step-ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round }
.steps a:hover .step-ic { border-color: var(--accent); box-shadow: 0 0 26px -6px var(--accent) }
.steps b { font: 500 1.1rem/1.25 var(--f-display); letter-spacing: -.02em }
@media (max-width: 860px) { .steps { grid-template-columns: 1fr 1fr; row-gap: 1.6rem } .steps li:nth-child(3) { border-left: 0 } .steps li:nth-child(3) a { padding-left: 0 } }
@media (max-width: 520px) { .steps { grid-template-columns: 1fr } .steps li + li { border-left: 0; border-top: 1px solid var(--line) } .steps a { padding: 1.3rem 0 } }

/* home: leaders */
.lb-card { position: relative; overflow: hidden; border-radius: var(--r) }
.lb-card::after { content: attr(data-place); position: absolute; right: .3rem; bottom: -2.2rem; font: 200 9rem/1 var(--f-display); letter-spacing: -.06em; color: rgba(255, 255, 255, .035); pointer-events: none }
.lb-card.place-1 { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); box-shadow: 0 0 50px -24px var(--accent);
  background: radial-gradient(90% 70% at 100% 100%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%), var(--glass), var(--panel) }
.lb-place, .lb-ava { border-radius: 50% }
.place-1 .lb-place { background: var(--grad) }
.lb-ava { font: 400 1.15rem var(--f-display) }
.lb-who b { font: 500 1.2rem/1.2 var(--f-display); letter-spacing: -.02em }
.lb-sub { font: 500 .6rem/1.4 var(--f-body) }
.lb-pts b { font-size: 2.6rem !important }

/* home: partners and FAQ */
.partners { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .8rem }
.partner { display: grid; align-content: space-between; gap: .8rem; min-height: 140px; padding: 1.4rem; border-radius: var(--r); border: 1px solid var(--line); background: var(--glass), var(--panel);
  color: var(--text); text-decoration: none; transition: border-color .3s, transform .35s var(--ease) }
.partner b { font: 500 1.35rem/1.1 var(--f-display); letter-spacing: .02em }
.partner.gen { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: radial-gradient(100% 120% at 100% 100%, color-mix(in srgb, var(--accent) 38%, transparent), transparent 65%), var(--panel) }
a.partner:hover { transform: translateY(-3px); border-color: var(--accent) }
.faq-sec { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); align-items: start; gap: 2rem 4rem; padding-top: 2.2rem; border-top: 1px solid var(--line) }
.faq-sec > .stack { gap: 1rem }
.faq-sec h2, .faq-sec p { margin: 0 }
.faq details { border-bottom: 1px solid var(--line) }
.faq summary { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.15rem 0; cursor: pointer; list-style: none; font: 400 1.12rem/1.35 var(--f-display); letter-spacing: -.02em; transition: color .2s }
.faq summary::-webkit-details-marker { display: none }
.faq summary::after { content: "+"; flex: none; width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: 50%; color: var(--accent); font-weight: 300; font-size: 1.1rem; transition: transform .3s var(--ease), border-color .3s }
.faq details[open] summary::after { transform: rotate(45deg); border-color: var(--accent) }
.faq summary:hover { color: var(--accent) }
.faq details p { margin: 0 0 1.3rem; max-width: 60ch; color: var(--soft); animation: rise .4s var(--ease) both }
@media (max-width: 860px) { .faq-sec { grid-template-columns: 1fr } }

/* tracks */
.tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 1rem }
.track { display: grid; align-content: start; overflow: hidden; padding: 0 }
.track-map { display: block; width: 100%; height: auto; padding: 1.2rem 1.2rem .4rem; border-bottom: 1px solid var(--line);
  background: radial-gradient(70% 70% at 50% 45%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%) }
.tm-base { fill: none; stroke: #25252a; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round }
.tm-run { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 12 88; filter: drop-shadow(0 0 6px var(--accent)); animation: run 6s linear infinite }
.track:nth-child(2n) .tm-run { animation-duration: 7.5s }
@keyframes run { to { stroke-dashoffset: -100 } }
.track-body { display: grid; gap: 1rem; padding: 1.3rem 1.4rem 1.5rem }
.track-body h3 { font: 400 1.5rem/1.1 var(--f-display); letter-spacing: -.03em }
.track-body p { margin: 0 }
.specs { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-block: 1px solid var(--line) }
.specs div { display: grid; gap: .3rem; padding: .8rem .2rem } .specs div + div { padding-left: .8rem; border-left: 1px solid var(--line) }
.specs dt { font: 500 .56rem var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.specs dd { margin: 0; font: 400 .92rem var(--f-display) }
.diff { display: inline-flex; gap: 3px } .diff i { width: 6px; height: 12px; border-radius: 2px; background: var(--line-2) } .diff i.on { background: var(--accent); box-shadow: 0 0 6px var(--accent) }
.rec { display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem .9rem }
.rec b { font: 300 1.9rem/1 var(--f-display); letter-spacing: -.04em; color: var(--accent) }

/* footer: big contact links, then the small line */
footer.site { border-top: 1px solid var(--line); background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--accent) 5%, transparent)), var(--bg) }
.fbar { display: block; padding-block: 1.8rem }
.fbig { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 2rem 4rem; padding-bottom: 2.6rem; margin-bottom: 1.6rem; border-bottom: 1px solid var(--line) }
.fcta { margin: 0; max-width: 20ch; font: 300 clamp(1.6rem, 3vw, 2.4rem)/1.15 var(--f-display); letter-spacing: -.035em; color: var(--text) }
.flinks { display: grid; grid-template-columns: 1fr 1fr; column-gap: 1.4rem }
.flinks a { display: flex; align-items: center; gap: .8rem; padding: 1rem 0; border-top: 1px solid var(--line); color: var(--text); text-decoration: none; font: 300 1.45rem var(--f-display); letter-spacing: -.03em; transition: color .25s, padding .35s var(--ease) }
.flinks svg { width: 20px; height: 20px; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: stroke .25s }
.flinks i { margin-left: auto; font-style: normal; color: var(--muted); transition: transform .3s var(--ease), color .25s }
.flinks a:hover { color: var(--accent); padding-left: .4rem } .flinks a:hover svg { stroke: var(--accent) } .flinks a:hover i { color: var(--accent); transform: translate(3px, -3px) }
.fline { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem 2rem; font-size: .82rem; color: var(--muted) }
.fline .l, .fline .r { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem 1.6rem }
.fline a:not(.flogo) { color: var(--soft); text-decoration: none } .fline a:not(.flogo):hover { color: var(--accent) }
.fline strong { color: var(--text) }
.flogo { height: 26px; padding: 0 .5rem; border-radius: 7px; font-size: .78rem; box-shadow: none }
@media (max-width: 760px) { .fbig { grid-template-columns: 1fr } .flinks a { font-size: 1.2rem } .lg-word { display: none } nav { gap: 1.4rem } }
@media (max-width: 420px) { .flinks { grid-template-columns: 1fr } }
@media (prefers-reduced-motion: reduce) { .g-in, .tm-run, .stripes, .gauge::before, .eyebrow i { animation: none } }


/* ================= v5 pages: rating, teams, team page, driver profiles — same glass, light type and orange light as the home page ================= */
.r-hero { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1.5rem 2rem; padding-bottom: 1.6rem; border-bottom: 1px solid var(--line) }
.r-hero .note { margin: 0; max-width: 46ch }
.r-title { margin: 0; font: 300 clamp(3rem, 7vw, 5.6rem)/.95 var(--f-display); letter-spacing: -.055em }
.tlogo { border-radius: 14px; border: 1px solid var(--line-2); background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%), var(--panel-2);
  font: 400 1rem var(--f-display) !important; letter-spacing: .02em; color: var(--text) }
.r-ava, .pl-ava, .pp-ava { flex: none; display: grid; place-items: center; border-radius: 50%; font-family: var(--f-display); font-weight: 300; color: var(--text);
  background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%), var(--panel-2); box-shadow: inset 0 0 0 1px var(--line-2) }

/* rating */
.r-podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 1rem }
.r-pod { position: relative; overflow: hidden; display: grid; align-content: end; gap: .9rem; min-height: 250px; padding: 1.5rem; border-radius: var(--r); border: 1px solid var(--line);
  background: var(--glass), var(--panel); color: var(--text); text-decoration: none; transition: transform .35s var(--ease), border-color .3s; animation: rise .7s var(--ease) both }
.r-pod.p1 { min-height: 310px; border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 60px -26px var(--accent); animation-delay: .08s;
  background: radial-gradient(90% 70% at 50% 115%, color-mix(in srgb, var(--accent) 34%, transparent), transparent 70%), var(--glass), var(--panel) }
.r-pod.p3 { animation-delay: .16s }
.r-pod:hover { transform: translateY(-4px); border-color: var(--line-2) }
.r-pod.p1:hover { border-color: var(--accent) }
.r-place { position: absolute; top: .5rem; right: 1rem; font: 200 5.5rem/1 var(--f-display); letter-spacing: -.06em; color: rgba(255, 255, 255, .06) }
.p1 .r-place { color: color-mix(in srgb, var(--accent) 45%, transparent) }
.r-pod .r-ava, .r-pod .tlogo { width: 60px; height: 60px; font-size: 1.5rem !important }
.r-pod b { font: 400 1.5rem/1.1 var(--f-display); letter-spacing: -.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.r-pod > .note { margin-top: -.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.r-pts { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding-top: .9rem; border-top: 1px solid var(--line) }
.r-pts b { font: 200 2.6rem/1 var(--f-display); letter-spacing: -.05em }
.p1 .r-pts b { color: var(--accent) }
.r-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem }
.r-tools .search { width: min(100%, 280px) }
.r-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem }
.r-row a { display: grid; grid-template-columns: 2.8rem 44px minmax(0, 1.3fr) minmax(0, 1fr) 5.5rem; align-items: center; gap: 1rem; padding: .7rem 1.1rem; border-radius: 14px;
  border: 1px solid var(--line); background: var(--glass), var(--panel); color: var(--text); text-decoration: none; transition: border-color .25s, background-color .25s;
  animation: rise .5s var(--ease) both; animation-delay: calc(min(var(--i), 14) * 30ms) }
.r-row a:hover { border-color: var(--line-2); background-color: var(--panel-2) }
.r-row.mine a { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)) }
.r-pos { font: 300 1.4rem var(--f-display); letter-spacing: -.04em; color: var(--muted); font-variant-numeric: tabular-nums }
.r-row.top .r-pos { color: var(--accent) }
.r-row .r-ava, .r-row .tlogo { width: 44px; height: 44px; font-size: 1rem !important; border-radius: 50% }
.r-row .tlogo { border-radius: 12px }
.r-name { display: grid; gap: .1rem; min-width: 0 }
.r-name b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.r-name .note { font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.r-bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden }
.r-bar i { display: block; width: calc(var(--w) * 100%); height: 100%; border-radius: inherit; background: var(--grad); transform-origin: left; animation: barIn 1s var(--ease) .2s both }
.r-ptsv { text-align: right; font: 300 1.45rem var(--f-display); letter-spacing: -.04em; font-variant-numeric: tabular-nums }
@media (max-width: 760px) {
  .r-podium { grid-template-columns: 1fr } .r-pod, .r-pod.p1 { min-height: 0 } .r-podium .p1 { order: -1 }
  .r-row a { grid-template-columns: 2.2rem 40px minmax(0, 1fr) auto; gap: .8rem } .r-bar { display: none } }

/* teams */
.tm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 1rem }
.tm-card { position: relative; overflow: hidden; display: grid; align-content: space-between; gap: 1.2rem; min-height: 250px; padding: 1.4rem; border-radius: var(--r); border: 1px solid var(--line);
  background: var(--glass), var(--panel); color: var(--text); text-decoration: none; transition: transform .35s var(--ease), border-color .3s }
.tm-card::after { content: ""; position: absolute; left: -20%; right: -20%; bottom: -55%; height: 75%; background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 70%, transparent), transparent);
  opacity: 0; transition: opacity .4s; pointer-events: none }
a.tm-card:hover { transform: translateY(-4px); border-color: var(--line-2) } a.tm-card:hover::after { opacity: .35 }
.tm-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem }
.tm-card .tlogo { width: 64px; height: 64px; font-size: 1.15rem !important }
.tm-status { display: inline-flex; align-items: center; gap: .45rem; justify-self: start; font: 500 .62rem var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--ok) }
.tm-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor }
.tm-status.closed { color: var(--muted) } .tm-status.closed::before { box-shadow: none }
.tm-name { font: 400 1.45rem/1.1 var(--f-display); letter-spacing: -.03em }
.tm-desc { margin: 0; color: var(--soft); font-size: .9rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.tm-foot { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: .7rem; padding-top: 1rem; border-top: 1px solid var(--line) }
.av-stack { display: flex }
.av-stack i { width: 26px; height: 26px; margin-left: -8px; display: grid; place-items: center; border-radius: 50%; background: var(--panel-2); box-shadow: 0 0 0 2px var(--panel), inset 0 0 0 1px var(--line-2);
  font: normal 400 .72rem var(--f-display); color: var(--soft) }
.av-stack i:first-child { margin-left: 0 }
.tm-pts { margin-left: auto; display: flex; align-items: baseline; gap: .4rem }
.tm-pts b { font: 300 1.5rem var(--f-display); letter-spacing: -.04em }
.tm-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 1.8rem 2.2rem; padding: 2.2rem; border-radius: 24px; border: 1px solid var(--line);
  background: radial-gradient(60% 100% at 0% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%), var(--glass), var(--panel); animation: rise .7s var(--ease) both }
.tm-hero .tlogo { width: 132px; height: 132px; border-radius: 26px; font-size: 2.2rem !important; box-shadow: 0 0 60px -20px var(--accent) }
.tm-hero h1 { margin: 0; font: 300 clamp(2.4rem, 5vw, 4rem)/1 var(--f-display); letter-spacing: -.05em }
.tm-lead { margin: 0; max-width: 60ch; color: var(--soft) }
.tm-hero .pp-stats { grid-column: 1 / -1 }
.pl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: .8rem }
.pl-card { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.2rem; border-radius: 16px; border: 1px solid var(--line); background: var(--glass), var(--panel); color: var(--text); text-decoration: none;
  transition: border-color .3s, transform .35s var(--ease); animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * 50ms) }
.pl-card:hover { border-color: var(--accent); transform: translateY(-3px) }
.pl-ava { width: 52px; height: 52px; font-size: 1.3rem }
.pl-card b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.pl-card .note { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.pl-right { margin-left: auto; display: grid; justify-items: end; gap: .15rem; text-align: right; flex: none }
.pl-num { font: 300 1.4rem/1 var(--f-display); letter-spacing: -.03em; color: var(--accent) }
@media (max-width: 640px) { .tm-hero { grid-template-columns: 1fr; padding: 1.4rem } .tm-hero .tlogo { width: 88px; height: 88px; font-size: 1.5rem !important } }

/* driver profile (own and public) */
.pp-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .8rem }
.pp-hero { position: relative; overflow: hidden; display: grid; gap: 2rem; padding: 2.2rem; border-radius: 24px; border: 1px solid var(--line);
  background: radial-gradient(60% 100% at 100% 0%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 65%), var(--glass), var(--panel); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
  animation: rise .7s var(--ease) both }
.pp-bgnum { position: absolute; right: -.04em; top: 50%; translate: 0 -58%; font: 200 clamp(9rem, 24vw, 18rem)/1 var(--f-display); letter-spacing: -.07em; color: transparent;
  -webkit-text-stroke: 1px color-mix(in srgb, var(--accent) 38%, transparent); pointer-events: none; user-select: none }
.pp-main { position: relative; display: flex; align-items: center; gap: 1.8rem }
.pp-ava { width: 112px; height: 112px; font-size: 2.8rem; box-shadow: inset 0 0 0 1px var(--line-2), 0 0 0 6px color-mix(in srgb, var(--accent) 10%, transparent), 0 0 50px -10px var(--accent) }
.pp-who { display: grid; gap: .75rem; min-width: 0 }
.pp-who h1 { margin: 0; font: 300 clamp(2.4rem, 5.5vw, 4.4rem)/.95 var(--f-display); letter-spacing: -.055em; overflow-wrap: anywhere }
.pp-chips { display: flex; flex-wrap: wrap; gap: .45rem }
.chip4 { display: inline-flex; align-items: center; gap: .45rem; padding: .38rem .75rem; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .02);
  font: 500 .78rem var(--f-body); color: var(--soft); text-decoration: none; transition: border-color .2s, color .2s }
.chip4.acc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent) }
a.chip4:hover { border-color: var(--accent); color: var(--text) }
.chip4 .tlogo { width: 18px; height: 18px; border-radius: 50%; font-size: .45rem !important; border: 0 }
.pp-bio { margin: 0; max-width: 60ch; color: var(--soft) }
.pp-stats { position: relative; margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.2rem }
.pp-stats div { position: relative; display: grid; gap: .6rem; padding-top: 1rem; border-top: 1px solid var(--line) }
.pp-stats div::before { content: ""; position: absolute; top: -1px; left: 0; width: 28px; height: 2px; background: var(--accent) }
.pp-stats dt { font: 500 .62rem var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted) }
.pp-stats dd { margin: 0; font: 200 clamp(2rem, 4vw, 3.2rem)/.95 var(--f-display); letter-spacing: -.05em }
.pp-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); align-items: start; gap: 1.2rem }
.psec, .pp-grid .box.panel { display: grid; gap: 1.1rem; padding: 1.6rem; border-radius: 20px; animation: rise .6s var(--ease) both }
.psec-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem }
.psec h3, .pp-grid .box h3 { margin: 0; font: 400 1.35rem var(--f-display); letter-spacing: -.03em }
.pp-grid .box .head { align-items: center }
.pp-side .numshow { font-size: 3.6rem !important }
.psec .tm-card { min-height: 0 }
.spec { margin: 0; display: grid }
.spec div { display: flex; justify-content: space-between; gap: 1rem; padding: .7rem 0; border-top: 1px solid var(--line) }
.spec div:first-child { border-top: 0 }
.spec dt { color: var(--muted); font-size: .86rem } .spec dd { margin: 0; text-align: right }
.qres { list-style: none; margin: 0; padding: 0; display: grid }
.qres a { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "l p s" "t p s"; align-items: center; column-gap: 1.2rem; padding: .8rem 0; border-top: 1px solid var(--line); color: var(--text); text-decoration: none }
.qres li:first-child a { border-top: 0 }
.qres .label { grid-area: l } .qres b { grid-area: t; font-weight: 500; transition: color .2s } .qres a:hover b { color: var(--accent) }
.qres-place { grid-area: p; font: 300 1.5rem var(--f-display); letter-spacing: -.04em; color: var(--soft) }
.qres-place.top { color: var(--accent) } .qres-place small { font-size: .7rem; color: var(--muted) }
.qres-best { grid-area: s; min-width: 3.2rem; text-align: right; font: 500 1rem var(--f-display); font-variant-numeric: tabular-nums }
.note-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; padding: .9rem 1.2rem; border-radius: 14px; border: 1px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--soft) }
@media (max-width: 900px) { .pp-grid { grid-template-columns: 1fr } }
@media (max-width: 640px) { .pp-hero { padding: 1.4rem } .pp-main { flex-direction: column; align-items: flex-start; gap: 1.2rem } .pp-ava { width: 84px; height: 84px; font-size: 2rem } .pp-stats { grid-template-columns: 1fr 1fr } }

/* admin: track difficulty */
.diff-pick { display: inline-flex; gap: 4px }
.diff-pick button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; color: var(--muted); font: 500 .8rem var(--f-display); cursor: pointer; transition: background .2s, color .2s, border-color .2s, box-shadow .2s }
.diff-pick button:hover { border-color: var(--accent) }
.diff-pick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 12px -3px var(--accent) }

/* ================= v6 "motion blur": a drift poster — black, an orange light leak, wide heavy type with a serif accent =================
   Speed is shown the way a camera sees it: slit-scan trails and blur that resolves into sharp type.
   Type: Unbounded (wide display, numbers) · Cormorant Garamond italic (accent words) · Inter Tight (text, labels).
   Motion is slow and quiet: things arrive out of blur, a single slit sweep on hover, one drifting light leak. */
:root {
  --bg: #060606; --panel: #0d0d0d; --panel-2: #151515; --line: #1f1f1f; --line-2: #2f2f2f;
  --text: #f3efe8; --muted: #7b766f; --soft: #b6b0a7;
  --accent: #ff5f0f; --accent-2: #ff9a4d; --accent-ink: #0a0400;
  --f-display: "Unbounded", "Arial Black", sans-serif; --f-serif: "Cormorant Garamond", Georgia, serif;
  --f-body: "Inter Tight", "Segoe UI", system-ui, sans-serif; --f-card: var(--f-body); --f-mono: var(--f-body); --f-logo: var(--f-display);
  --r: 6px; --glass: linear-gradient(transparent, transparent); --grad: linear-gradient(90deg, var(--accent), var(--accent-2));
  --ease: cubic-bezier(.16, 1, .3, 1);
}
body { font: 400 16px/1.6 var(--f-body); letter-spacing: 0 }
h1, h2 { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; letter-spacing: -.035em; line-height: .98 }
h2 { font-size: clamp(1.7rem, 3.6vw, 2.8rem) }
h1 em, h2 em { font-family: var(--f-serif); font-style: italic; font-weight: 500; text-transform: none; letter-spacing: -.01em; color: var(--accent); padding-right: .08em }
h3 { font-family: var(--f-body); font-weight: 600; letter-spacing: -.01em }
.label { font: 500 .64rem/1.3 var(--f-body); letter-spacing: .28em; text-transform: uppercase; color: var(--muted) }
.label.acc, .acc, .idx { color: var(--accent) }

/* numbers and titles: wide and heavy instead of thin */
.stat b, .lb-pts b, .numshow, .pc-rate b, .cd b, .facts b, .next-date b, .wm, .kpi b, .r-pts b, .r-ptsv, .tm-pts b, .pp-stats dd, .qres-place, .pl-num, .cal-n, .r-pos {
  font-family: var(--f-display) !important; font-weight: 600 !important; font-style: normal !important; letter-spacing: -.04em !important }
.who h1, .tdetail-head h3, .tcard h3, .prose h3, .intro-lead h2, .tierline b, .r-title, .pp-who h1, .tm-hero h1, .track-body h3, .psec h3, .pp-grid .box h3 {
  font-family: var(--f-display) !important; font-weight: 800 !important; font-style: normal !important; text-transform: uppercase; letter-spacing: -.035em !important }
.tcard h3, .track-body h3, .psec h3, .pp-grid .box h3 { font-size: 1.15rem !important; font-weight: 700 !important; letter-spacing: -.02em !important }
.r-title { font-size: clamp(2.6rem, 7vw, 5.4rem) } .pp-who h1, .tm-hero h1 { font-size: clamp(2rem, 5vw, 3.8rem) }
.tm-name, .r-pod b, .lb-who b, .cal-body b, .steps b, .cmp-who b { font-family: var(--f-display) !important; font-weight: 700 !important; text-transform: uppercase; letter-spacing: -.02em !important; font-size: 1.05rem !important }
.r-ava, .pl-ava, .pp-ava, .lb-ava, .tlogo, .av-stack i, .ava { font-family: var(--f-display) !important; font-weight: 700 !important }
.statement { max-width: 32ch; font: 500 clamp(1.55rem, 3vw, 2.5rem)/1.2 var(--f-body); letter-spacing: -.03em; text-wrap: pretty }
.statement span { color: #6b6760; font-weight: 400 }
.kpi b { font-size: clamp(2.4rem, 5vw, 4rem) !important }
.cal-n { font-size: 2.4rem !important; color: var(--muted) }
.pp-stats dd { font-size: clamp(1.6rem, 3.4vw, 2.6rem) !important }
.r-pts b { font-size: 2.1rem !important } .r-ptsv { font-size: 1.15rem !important } .r-pos { font-size: 1.05rem !important }
.r-place { font: 800 5rem/1 var(--f-display) !important; letter-spacing: -.06em !important; color: transparent !important; -webkit-text-stroke: 1px rgba(255, 255, 255, .1) }
.p1 .r-place { -webkit-text-stroke-color: color-mix(in srgb, var(--accent) 60%, transparent) }
/* driver number behind the profile hero: one quiet solid figure, no effects */
.pp-bgnum { right: clamp(1rem, 4vw, 3rem); top: 50%; translate: 0 -50%; font: 600 clamp(6rem, 16vw, 12rem)/1 var(--f-display) !important; letter-spacing: -.05em !important;
  color: color-mix(in srgb, var(--accent) 12%, transparent) !important; -webkit-text-stroke: 0 !important }
.lb-card::after { font-weight: 800 !important; color: transparent !important; -webkit-text-stroke: 1px rgba(255, 255, 255, .06) }

/* surfaces: flat, hairline, sharp-ish — no glass */
.panel, .cal-card, .tm-card, .r-pod, .pl-card, .r-row a, .psec, .pp-hero, .tm-hero, .track, .lb-card, .tcard { border-radius: var(--r) !important; box-shadow: none }
.panel { background: var(--panel); border: 1px solid var(--line) }
.pp-hero, .tm-hero { background: radial-gradient(70% 120% at 100% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 65%), var(--panel) }
.r-pod.p1, .lb-card.place-1, .tcard.current, .cal-card.cur { box-shadow: none }

/* buttons: pill, orange; hover flips to bone; a quiet blur streak crosses on hover */
.btn { height: 50px; padding: 0 1.7rem; border-radius: 999px; border: 0; font: 600 .72rem/1 var(--f-body); letter-spacing: .18em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); box-shadow: none;
  transition: background .4s var(--ease), color .3s, border-color .3s, transform .4s var(--ease) }
.btn:hover { background: var(--text); color: var(--bg); transform: none; box-shadow: none }
.btn.line, .steam { background: transparent; color: var(--text); border: 1px solid var(--line-2) }
.btn.line:hover, .steam:hover { background: var(--text); color: var(--bg); border-color: var(--text); box-shadow: none }
.btn.sm { height: 38px; padding: 0 1.15rem; font-size: .64rem; border-radius: 999px }
.btn.text { height: auto; padding: .3rem 0; background: none; border: 0; color: var(--soft); font: 500 .86rem var(--f-body); letter-spacing: 0; text-transform: none }
.btn.text:hover { background: none; color: var(--accent) }
.pill { border-radius: 999px }
.seg2 { border-radius: 999px; padding: 4px } .seg2 button { border-radius: 999px; letter-spacing: .2em }
.seg2 button[aria-selected="true"], .tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }

/* header */
header { background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line) }
.lg-mark { height: auto; padding: 0; background: none !important; box-shadow: none !important; color: var(--text) !important; font: 800 1.15rem/1 var(--f-display); letter-spacing: -.03em }
.lg-mark::after { content: ""; display: inline-block; width: .32em; height: .32em; margin-left: .14em; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent) }
.lg-word { font: 500 italic 1rem/1 var(--f-serif); color: var(--soft); letter-spacing: 0; white-space: nowrap }
.steam { white-space: nowrap }
@media (max-width: 520px) { .steam { height: 34px; padding: 0 .8rem; font-size: .56rem; letter-spacing: .08em } .right { gap: .6rem } }
nav a { font: 500 .66rem/1 var(--f-body); letter-spacing: .24em }
nav a[aria-current] { color: var(--accent) }
.ava { border-color: var(--line-2); background: var(--panel-2); color: var(--text) }

/* background: black, faint column lines, one drifting slit-scan light leak, warm cursor glow, grain */
.bg::before { background-image: linear-gradient(90deg, rgba(255, 255, 255, .03) 1px, transparent 1px); background-size: calc(100% / 12) 100%; background-position: 0 0;
  -webkit-mask-image: linear-gradient(180deg, #000, transparent 90%); mask-image: linear-gradient(180deg, #000, transparent 90%) }
.bg-glow { background: radial-gradient(45vmax 30vmax at 100% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%); animation: none }
.stripes { top: -10vh; right: -6vw; width: 22vw; height: 120vh; opacity: .07; filter: blur(30px);
  background: linear-gradient(90deg, transparent, #ff2e00 18%, var(--accent) 40%, #ffd1a3 50%, var(--accent) 60%, transparent 85%);
  -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 22px, rgba(0, 0, 0, .35) 22px 34px, #000 34px 60px, rgba(0, 0, 0, .1) 60px 70px);
  mask-image: repeating-linear-gradient(90deg, #000 0 22px, rgba(0, 0, 0, .35) 22px 34px, #000 34px 60px, rgba(0, 0, 0, .1) 60px 70px);
  animation: leak 26s ease-in-out infinite alternate }
@keyframes leak { from { translate: -4vw 0 } to { translate: 4vw 0 } }
.spot { opacity: 0; background: radial-gradient(520px circle at var(--mx) var(--my), color-mix(in srgb, var(--accent) 7%, transparent), transparent 70%); -webkit-mask-image: none; mask-image: none }
.grain { opacity: .08 }

/* HUD marks */
.cross { position: absolute; width: 13px; height: 13px; opacity: .5; pointer-events: none }
.cross::before, .cross::after { content: ""; position: absolute; background: var(--soft) }
.cross::before { left: 6px; top: 0; bottom: 0; width: 1px } .cross::after { top: 6px; left: 0; right: 0; height: 1px }
.c1 { left: 0; top: 0 } .c2 { right: 0; top: 0 } .c3 { left: 0; bottom: 0 } .c4 { right: 0; bottom: 0 }

/* home: poster hero */
.hero6 { display: grid; gap: 1.8rem; padding-top: .4rem }
.h6-top { display: flex; justify-content: space-between; gap: 1rem; font: 500 .7rem var(--f-body); letter-spacing: .2em; text-transform: uppercase; color: var(--soft) }
.h6-stage { position: relative; display: grid; place-items: center; min-height: clamp(320px, 52vh, 520px); padding: 2.5rem 0; isolation: isolate }
.h6-title { position: relative; margin: 0; display: grid; justify-items: center; font: 800 clamp(2.6rem, 12.5vw, 10.5rem)/.86 var(--f-display); letter-spacing: -.055em; text-transform: uppercase; text-align: center }
.h6-title .w { position: relative; display: block; animation: blurIn 1.4s var(--ease) both }
.h6-title .w:last-child { animation-delay: .18s }
.h6-title em { position: relative; z-index: 2; margin: -.32em 0 -.3em; font: 500 italic .62em/1 var(--f-serif); letter-spacing: -.02em; text-transform: none; color: var(--text);
  text-shadow: 0 0 40px rgba(0, 0, 0, .6); animation: blurIn 1.6s var(--ease) .4s both }
@keyframes blurIn { from { opacity: 0; filter: blur(18px); transform: translateX(-4%) scaleX(1.06); letter-spacing: .02em } }
@keyframes wordIn { from { opacity: 0; filter: blur(10px); transform: translateY(8px) } }
.h6-code { position: absolute; top: 0; left: 24px; font: 500 .6rem var(--f-body); letter-spacing: .2em; color: var(--muted) }
.h6-code.r { left: auto; right: 24px }
.h6-bottom { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); align-items: end; gap: 2rem 3rem; animation: blurIn 1.2s var(--ease) .5s both }
.h6-tag { margin: 0; max-width: 24ch; font: 400 italic clamp(1.5rem, 2.6vw, 2.1rem)/1.15 var(--f-serif); color: var(--text) }
.ticket { display: grid; gap: 0; padding: 1rem 1.2rem 1.1rem; border: 1px solid var(--line-2); border-radius: var(--r); background: rgba(13, 13, 13, .7); backdrop-filter: blur(10px);
  color: var(--text); text-decoration: none; transition: border-color .4s var(--ease) }
.ticket:hover { border-color: var(--accent) }
.tk-head { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding-bottom: .8rem; font: 700 .82rem var(--f-display); letter-spacing: -.01em; text-transform: uppercase }
.tk-row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding: .55rem 0; border-top: 1px solid var(--line); font-size: .9rem; font-variant-numeric: tabular-nums }
.ticket .cd { display: flex; gap: .4rem } .ticket .cd div { display: flex; align-items: baseline; gap: .1rem; padding: 0; border: 0; background: none }
.ticket .cd b { font-size: .95rem !important; font-weight: 600 !important; letter-spacing: -.02em !important } .ticket .cd span { font-size: .58rem; color: var(--muted) }
.tk-go { display: flex; justify-content: space-between; margin-top: .4rem; padding-top: .8rem; border-top: 1px solid var(--line); font: 600 .66rem var(--f-body); letter-spacing: .2em; text-transform: uppercase; color: var(--accent) }
.ticket:hover .tk-go span { translate: 3px -3px } .tk-go span { transition: translate .4s var(--ease) }
.h6-sponsor { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.4rem; padding-top: 1.2rem; border-top: 1px solid var(--line) }
.h6-sponsor strong { font: 700 .82rem var(--f-display); letter-spacing: .06em }
.h6-sponsor .btn { margin-left: auto }
@media (max-width: 860px) { .h6-bottom { grid-template-columns: 1fr } }
@media (max-width: 520px) { .h6-code { display: none } .h6-sponsor .btn { margin-left: 0 } }

/* slit sweep on hover: one band of vertical slits crosses the card */
.cal-card, .tm-card, .r-pod, .pl-card, .tcard, .lb-card, .track { position: relative; overflow: hidden }
.cal-card::before, .tm-card::before, .r-pod::before, .pl-card::before, .tcard::before, .lb-card::before { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 60%; z-index: 3; pointer-events: none; opacity: 0;
  background: repeating-linear-gradient(90deg, transparent 0 7px, color-mix(in srgb, var(--accent) 24%, transparent) 7px 9px);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000, transparent); mask-image: linear-gradient(90deg, transparent, #000, transparent) }
.cal-card:hover::before, .tm-card:hover::before, .r-pod:hover::before, .pl-card:hover::before, .tcard:hover::before, .lb-card:hover::before { animation: slit 1s var(--ease) }
@keyframes slit { 0% { opacity: 1; transform: translateX(0) } 100% { opacity: 0; transform: translateX(270%) } }
.cal-card:hover, .tm-card:hover, .r-pod:hover, .pl-card:hover, .tcard:hover { transform: none !important }

/* page and scroll motion: content resolves out of blur */
#app.enter > * { animation: pageIn .9s var(--ease) both }
@keyframes pageIn { from { opacity: 0; filter: blur(10px); transform: translateY(12px) } }
.reveal > * { transition: opacity 1.1s var(--ease), transform 1.1s var(--ease), filter 1.1s var(--ease) }
.reveal.pre > * { opacity: 0; transform: translateY(24px); filter: blur(8px) }

/* small parts */
.faq summary { font: 500 1.05rem/1.35 var(--f-body); letter-spacing: -.01em }
.fcta { font: 400 italic clamp(1.7rem, 3.2vw, 2.6rem)/1.12 var(--f-serif); letter-spacing: -.01em }
.flinks a { font: 700 1.05rem var(--f-display); letter-spacing: -.02em; text-transform: uppercase }
.flogo { background: none !important; box-shadow: none; color: var(--text) !important; font: 800 .95rem var(--f-display); padding: 0 }
.sec-head { border-bottom-color: var(--line) }
.step-ic { border-radius: 50% }
.chip4, .tm-status, .diff-pick button { border-radius: 999px }
.ov-card, .ov-battle, .ov-preview { --f-display: "Inter Tight", system-ui, sans-serif }
@media (prefers-reduced-motion: reduce) {
  .h6-title .w, .h6-title em, .h6-bottom, .stripes { animation: none }
  .reveal.pre > * { filter: none } }

/* background: a quiet lava lamp on black — warm wax blobs drifting up and down, softened and kept dim; a shade calms the content area */
:root { --bg: #000 }
.bg { background: #000 }
#lava { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; filter: blur(3px); transition: opacity 3s cubic-bezier(.16, 1, .3, 1) }
.has-lava #lava { opacity: .34 }
.lava-shade { position: absolute; inset: 0; background: radial-gradient(70% 60% at 50% 42%, rgba(0, 0, 0, .55), transparent 75%) }
.bg::before, .bg-glow, .stripes { display: none }
/* header on one row at mid widths */
@media (max-width: 1120px) and (min-width: 761px) { nav { gap: 1rem; flex-wrap: nowrap } nav a { letter-spacing: .14em } .lg-word { display: none } .bar { gap: .75rem 1rem } .steam { height: 38px; padding: 0 1rem; font-size: .6rem; letter-spacing: .1em } .right { gap: .7rem } }


/* native dropdowns: dark popup with readable items (Windows draws them white otherwise) */
select { color-scheme: dark }
select option, select optgroup { background: #111; color: var(--text) }
select optgroup { color: var(--accent); font-style: normal; font-weight: 600 }
select option:checked { background: var(--accent); color: var(--accent-ink) }

/* profile hero: car, engine, gearbox and power */
.pp-car { position: relative; margin: 0; display: flex; flex-wrap: wrap; gap: .5rem }
.pp-car div { display: grid; gap: .3rem; min-width: 8.5rem; padding: .6rem .95rem; border: 1px solid var(--line-2); border-radius: var(--r); background: rgba(255, 255, 255, .02) }
.pp-car dt { font: 500 .58rem var(--f-body); letter-spacing: .2em; text-transform: uppercase; color: var(--muted) }
.pp-car dd { margin: 0; font: 700 .86rem/1.15 var(--f-display); letter-spacing: -.01em; text-transform: uppercase }
.pp-car div:first-child { border-color: color-mix(in srgb, var(--accent) 45%, var(--line-2)) }
@media (max-width: 640px) { .pp-car div { flex: 1 1 calc(50% - .25rem); min-width: 0 } }

/* ================= type system: one scale and one rhythm for every page =================
   Unbounded — page titles, section titles, card titles and numbers (uppercase, tight).
   Inter Tight — everything you read: text, notes, tables, forms, buttons, labels.
   Cormorant italic — only the accent word in section titles and the tagline. */
:root { --fs-h1: clamp(2.3rem, 5.4vw, 4.2rem); --fs-h2: clamp(1.55rem, 2.9vw, 2.3rem); --fs-h3: 1rem; --fs-small: .875rem; --fs-label: .66rem; --track: .2em }
body { font-size: 1rem; line-height: 1.6 }
p { line-height: 1.6 }
.note { font-size: var(--fs-small); line-height: 1.55 }
/* small caps labels: one size, one tracking */
.label, .eyebrow, th, .pill, .tm-status, .lb-sub, .hud-rows dt, .specs dt, .pp-stats dt, .pp-car dt, .h6-top, .h6-code, .more, .tk-go { letter-spacing: var(--track) !important }
.label { font-size: var(--fs-label) !important; font-weight: 500 !important }
th { font-size: .62rem !important }
nav a, .seg2 button { font-size: .68rem !important; letter-spacing: .18em !important }
.btn { font-size: .7rem; letter-spacing: .16em } .btn.sm { font-size: .64rem } .btn.text { letter-spacing: 0 }
/* titles */
h1:not(.h6-title), .r-title, .pp-who h1, .tm-hero h1 { font-size: var(--fs-h1) !important; font-weight: 800 !important; letter-spacing: -.035em !important; line-height: .95 !important }
h2 { font-size: var(--fs-h2) !important; letter-spacing: -.03em !important; line-height: 1 !important }
h1 em, h2 em { font-size: 1.08em; letter-spacing: -.01em }
/* card titles: the same size everywhere */
.tcard h3, .track-body h3, .psec h3, .pp-grid .box h3, .tm-name, .r-pod b, .lb-who b, .cal-body b, .steps b, .tdetail-head h3 {
  font-family: var(--f-display) !important; font-size: var(--fs-h3) !important; font-weight: 700 !important; letter-spacing: -.015em !important; line-height: 1.15 !important; text-transform: uppercase }
.prose h3 { font-size: 1.15rem !important }
h3, h4 { line-height: 1.25 }
/* numbers */
.kpi b { font-size: clamp(2.2rem, 4.4vw, 3.4rem) !important }
.pp-stats dd { font-size: clamp(1.5rem, 3vw, 2.2rem) !important }
.r-pts b, .lb-pts b { font-size: 2rem !important } .tm-pts b, .r-ptsv { font-size: 1.15rem !important } .cal-n { font-size: 2.2rem !important }
/* reading text */
.statement { font-size: clamp(1.45rem, 2.7vw, 2.2rem) }
.h6-tag { font-size: clamp(1.35rem, 2.3vw, 1.85rem) }
.faq summary { font-size: 1rem }
td { font-size: .92rem }
.tm-desc, .pp-bio, .tm-lead, .prose p, .prose li { color: var(--soft) }

/* ================= one face per role =================
   Unbounded: titles, card titles, big numbers and the logo — nothing else.
   Inter Tight: everything else (labels, values, buttons, chips, tables, forms, tags). Weights: 400 text, 500 labels, 600 names and values.
   Cormorant italic stays only as the accent word in section titles and in the hero tagline. */
:root { --f-head: "Unbounded", "Arial Black", sans-serif; --f-display: "Inter Tight", "Segoe UI", system-ui, sans-serif }
h1, h2, .h6-title, .r-title, .pp-who h1, .tm-hero h1, .who h1, .tcard h3, .track-body h3, .psec h3, .pp-grid .box h3, .tm-name, .r-pod b, .lb-who b, .cal-body b, .steps b, .tdetail-head h3, .prose h3, .tk-head, .stat b, .lb-pts b, .numshow, .cd b, .kpi b, .r-pts b, .r-ptsv, .tm-pts b, .pp-stats dd, .qres-place, .pl-num, .cal-n, .r-pos, .rec b, .lg-mark, .flogo, .r-place, .pp-bgnum, .lb-card::after, .lb-place { font-family: var(--f-head) !important }
h1 em, h2 em, .h6-title em { font-family: var(--f-serif) !important }
.lg-word { font: 500 .8rem/1 var(--f-body); letter-spacing: 0; font-style: normal }
.specs dd, .pp-car dd, .spec dd, .hud-rows dd, .tk-row, .r-name b, .pl-card b, .cmp-who b, .chip4 { font-family: var(--f-body) !important; font-weight: 600; letter-spacing: 0; text-transform: none }
.specs dd, .spec dd, .tk-row span:last-child { font-size: .92rem }
.pp-car dd { font-size: .9rem; text-transform: none }
.tlogo, .r-ava, .pl-ava, .pp-ava, .lb-ava, .av-stack i, .ava { font-family: var(--f-body) !important; font-weight: 600 !important }
.pill, .tm-status, .label, th, .btn, nav a, .seg2 button { font-family: var(--f-body) !important }

/* ================= restrained type: two faces, quiet weights =================
   Unbounded (semibold) only for titles, card titles and numbers; Inter Tight for everything else. No serif, no italics. */
:root { --f-serif: var(--f-body) }
h1:not(.h6-title), h2, .r-title, .pp-who h1, .tm-hero h1 { font-weight: 600 !important; letter-spacing: -.025em !important }
.h6-title { font-weight: 700 !important; letter-spacing: -.045em !important }
.tcard h3, .track-body h3, .psec h3, .pp-grid .box h3, .tm-name, .r-pod b, .lb-who b, .cal-body b, .steps b, .tdetail-head h3, .prose h3, .tk-head { font-weight: 600 !important; letter-spacing: -.01em !important }
.stat b, .lb-pts b, .numshow, .cd b, .kpi b, .r-pts b, .r-ptsv, .tm-pts b, .pp-stats dd, .qres-place, .pl-num, .cal-n, .r-pos, .rec b { font-weight: 500 !important }
/* accent words in titles: same face, only the colour changes */
h1 em, h2 em { font-family: inherit !important; font-style: normal !important; font-weight: inherit !important; text-transform: inherit !important; font-size: 1em !important; letter-spacing: inherit !important; color: var(--accent) }
/* hero: "drift" becomes a small spaced label between the two words */
.h6-title em { font: 500 .11em/1 var(--f-body) !important; letter-spacing: .5em !important; text-transform: uppercase !important; color: var(--accent) !important; margin: .55em 0 .5em !important; padding-left: .5em; text-shadow: none }
.h6-tag { font: 400 clamp(1.05rem, 1.6vw, 1.25rem)/1.55 var(--f-body) !important; color: var(--soft); max-width: 30ch }
.statement { font-weight: 400 }
.statement span { font-weight: 400 }

/* ---- form rows: two fields side by side (car, settings, broadcast) ---- */
.car-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem 1rem }
@media (max-width: 640px) { .car-form { grid-template-columns: 1fr } }

/* ---- profile: achievements ---- */
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 215px), 1fr)); gap: .6rem }
.ach { display: flex; align-items: center; gap: .9rem; min-height: 104px; padding: .9rem 1rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); transition: border-color .3s, background-color .3s }
.ach-ic { flex: none; width: 2rem; text-align: center; font-size: 1.6rem; line-height: 1; filter: grayscale(1) brightness(.8); opacity: .55; transition: filter .3s, opacity .3s }
.ach b { display: block; font: 600 .9rem/1.25 var(--f-body); color: var(--soft) }
.ach-d { display: block; margin-top: .3rem; font-size: .78rem; line-height: 1.4; color: var(--muted) }
.ach:hover { border-color: var(--line-2) }
.ach.on { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background-color: color-mix(in srgb, var(--accent) 7%, var(--panel-2)) }
.ach.on .ach-ic { filter: none; opacity: 1 } .ach.on b { color: var(--text) }
.ach-count { font: 600 1.1rem var(--f-head); color: var(--text) } .ach-count span { color: var(--muted) }

/* ---- profile: start number (picked number on the left, grid on the right), team + about side by side with equal height ---- */
.num-wrap { display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); align-items: start; gap: 1.4rem }
.num-wrap .numshow { height: 112px; font-size: 3.4rem !important }
.num-wrap .numgrid { grid-template-columns: repeat(20, minmax(0, 1fr)) }
.pp-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: stretch; gap: 1.2rem }
.pp-pair > .psec { align-content: start }
.pp-pair textarea { min-height: 180px }
@media (max-width: 900px) { .num-wrap, .pp-pair { grid-template-columns: 1fr } .num-wrap .numgrid { grid-template-columns: repeat(10, minmax(0, 1fr)) } }

/* ---- tracks: every card the same height, the difficulty row pinned to the bottom ---- */
.track { display: flex !important; flex-direction: column }
.track-body { flex: 1; display: flex !important; flex-direction: column; gap: 1rem }
.track-body .specs { margin-top: auto; grid-template-columns: 1fr }

/* ---- broadcast panel ---- */
.bc-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: stretch; gap: 1.2rem }
.bc-top > .psec { align-content: start }
@media (max-width: 900px) { .bc-top { grid-template-columns: 1fr } }
.obs-list { list-style: none; margin: 0; padding: 0; display: grid }
.obs-list li { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .75rem 0; border-top: 1px solid var(--line) }
.obs-list li:first-child { border-top: 0 }
.obs-list b { font: 600 .92rem var(--f-body) }
.obs-list code { font: 500 .78rem var(--f-body); color: var(--accent) }
.ov-preview { padding: 18px; border: 1px solid var(--line); border-radius: var(--r); background: repeating-conic-gradient(#121212 0% 25%, #0b0b0b 0% 50%) 50% / 22px 22px; transition: opacity .3s, filter .3s }
.bc-ov.off .ov-preview { opacity: .35; filter: grayscale(.7) }
.live-dot { display: inline-block; width: 7px; height: 7px; margin-right: .6rem; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); vertical-align: middle; animation: blink 1.4s ease-in-out infinite }
/* on/off switch */
.switch { position: relative; display: inline-flex; align-items: center; gap: .6rem; cursor: pointer; font-size: .86rem; color: var(--soft); user-select: none }
.switch input { position: absolute; width: 1px; height: 1px; opacity: 0 }
.switch i { position: relative; flex: none; width: 38px; height: 22px; border-radius: 999px; background: var(--line-2); transition: background .25s }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--text); transition: transform .25s var(--ease), background .25s }
.switch input:checked + i { background: var(--accent) }
.switch input:checked + i::after { transform: translateX(16px); background: var(--accent-ink) }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px }

/* profile pairs: number grid fits a half-width card, the about textarea fills its card */
.pp-pair .num-wrap { grid-template-columns: 1fr } .pp-pair .num-wrap .numgrid { grid-template-columns: repeat(10, minmax(0, 1fr)) }
.pp-pair > .psec:has(.pp-about) { display: flex; flex-direction: column }
.pp-about { flex: 1; display: flex; flex-direction: column } .pp-about textarea { flex: 1 }

/* car parts: a list with five visible rows, scrolls inside */
.car-form > .fieldlabel { align-content: start }
.car-stack { display: grid; gap: 1.1rem }
.picklist { position: relative; display: grid; gap: 2px; height: calc(5 * 2.75rem + 4 * 2px + 2 * 5px); padding: 5px; overflow-y: auto; overscroll-behavior: contain; border: 1px solid var(--line-2); border-radius: 4px; background: transparent; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; transition: border-color .25s }
.picklist:focus-within { border-color: var(--accent) }
.pick { display: flex; align-items: center; justify-content: space-between; gap: 1rem; height: 2.75rem; padding: 0 .9rem; border: 0; border-radius: 3px; background: transparent; color: var(--soft); text-align: left; cursor: pointer; transition: background-color .2s, color .2s }
.pick b { font: 600 .9rem var(--f-body); color: inherit; white-space: nowrap }
.pick span { overflow: hidden; font-size: .8rem; color: var(--muted); white-space: nowrap; text-overflow: ellipsis }
.pick:hover { background: rgba(255,255,255,.045); color: var(--text) }
.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
.pick[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--text); box-shadow: inset 2px 0 0 var(--accent) }
.pick[aria-selected="true"] span { color: var(--soft) }

/* profile: achievements fold open and closed */
.ach-box > summary { list-style: none; cursor: pointer; user-select: none }
.ach-box > summary::-webkit-details-marker { display: none }
.ach-box:not([open]) { gap: 0 }
.ach-chev { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: 50%; transition: border-color .25s, transform .35s var(--ease) }
.ach-chev::before { content: ""; width: 7px; height: 7px; margin-top: -3px; border-right: 1.5px solid var(--soft); border-bottom: 1.5px solid var(--soft); transform: rotate(45deg) }
.ach-box > summary:hover .ach-chev { border-color: var(--accent) }
.ach-box[open] .ach-chev { transform: rotate(180deg) }
.ach-box[open] .ach-grid { animation: rise .45s var(--ease) both }

.ach-table .ai.ach-ic-in { width: 3.4rem; text-align: center; font-size: 1.1rem }
.ach-table .ai.wide { width: 100%; min-width: 7rem } .ach-table td, .ach-table th { padding-inline: .45rem } .ach-table td.muted { white-space: normal; font-size: .78rem }

/* season leaders: 2nd silver, 3rd bronze, lit the same way as the leader card */
.lb-card.place-2 { --pc: var(--silver) } .lb-card.place-3 { --pc: var(--bronze) }
.lb-card:is(.place-2, .place-3) { border-color: color-mix(in srgb, var(--pc) 40%, var(--line));
  background: radial-gradient(90% 70% at 100% 100%, color-mix(in srgb, var(--pc) 14%, transparent), transparent 70%), var(--glass), var(--panel) }
:is(.place-2, .place-3) .lb-place { background: var(--pc); color: #111 }
:is(.place-2, .place-3) .lb-ava { border-color: color-mix(in srgb, var(--pc) 55%, var(--line-2)) }
:is(.place-2, .place-3) .lb-pts b, :is(.place-2, .place-3) .lb-top .label.acc { color: var(--pc) }
/* rating podium: 2nd silver, 3rd bronze, lit like the leader */
.r-pod.p2 { --pc: var(--silver) } .r-pod.p3 { --pc: var(--bronze) }
.r-pod:is(.p2, .p3) { border-color: color-mix(in srgb, var(--pc) 42%, var(--line));
  background: radial-gradient(90% 70% at 50% 115%, color-mix(in srgb, var(--pc) 20%, transparent), transparent 70%), var(--glass), var(--panel) }
.r-pod:is(.p2, .p3):hover { border-color: var(--pc) }
.r-pod:is(.p2, .p3) > .label, .r-pod:is(.p2, .p3) .r-pts b { color: var(--pc) }
.r-pod:is(.p2, .p3) .r-place { -webkit-text-stroke-color: color-mix(in srgb, var(--pc) 55%, transparent) }
.r-row.top.p2 .r-pos { color: var(--silver) } .r-row.top.p3 .r-pos { color: var(--bronze) }
/* track difficulty: one thin full-width scale, level name on the right */
.diff-row { display: grid; gap: .65rem }
.diff-row dt { display: flex; justify-content: space-between; align-items: baseline }
.diff-row dt span { color: var(--soft); letter-spacing: normal; text-transform: none; font-size: .78rem }
.diff-row dd { margin: 0 }
.diff-row .diff { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; width: 100% }

// scroll reveal: only blocks that start below the fold are hidden first, so the page is complete without scrolling or JS
let revealIO = null;
function setupReveal() {
  const els = [...document.querySelectorAll(".reveal")];
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  revealIO?.disconnect();
  revealIO = new IntersectionObserver(entries => entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.remove("pre");
    e.target.querySelectorAll("[data-count]").forEach(countUp);
    revealIO.unobserve(e.target);
  }), { threshold: .15 });
  els.forEach(el => { if (el.getBoundingClientRect().top > innerHeight * .9) { el.classList.add("pre"); revealIO.observe(el); } });
}
function countUp(el) {
  const to = +el.dataset.count, t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0) / 1100); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function tournament(id) {
  const x = TOURS.find(z => z.id === id);
  if (!x) return tournaments();
  const isReg = S.regs.includes(id), runs = x.status !== "reg" && x.status !== "soon";
  const rows = stageRows(x).map(([p, i]) => {
    const a = scoreOf(x, p, i, 0), b = scoreOf(x, p, i, 1);
    return { ...p, a, b, best: Math.max(a ?? -1, b ?? -1) };
  }).sort((p, q) => q.best - p.best || p.num - q.num);
  const cell = v => v == null ? "—" : v.toFixed(1);
  let action = x.status === "soon" ? `<p class="note">${t("regSoon")}</p>` : "";

    if (x !== currentTour()) action = `<p class="note">${t("regLater")}</p>`;

    else if (!isReg && regCount(x) >= SETTINGS.maxStage) action = `<p class="note">${t("stageFull")}</p>`;

    else action = isReg ? `<span class="pill plain ok-pill">${t("participating")}</span><button class="btn text" data-act="unreg" data-id="${id}">${t("cancel")}</button>`
                        : `<button class="btn" data-act="reg" data-id="${id}">${t("register")}</button>`;

function achUnlocked(name) {
  const q = qualOf(name), got = new Set();
  if (q.length) got.add("debut");
  if (q.some(r => r.place === 1)) got.add("qking");
  if (q.some(r => r.a >= 100 || r.b >= 100)) got.add("perfect");
  if (q.some(r => r.a >= 0 && r.b >= 0 && Math.abs(r.a - r.b) <= .5)) got.add("sniper");
  if (q.some(r => r.a === 0 && r.b === 0)) got.add("spin");
  const season = seasonTours(curSeason());
  if (season.length && season.every(x => q.some(r => r.x === x))) got.add("iron");
  return got;
