/* section titles on the stage page match the card titles elsewhere */
#app > section.stack > h3, #app > section.stack > div > h3, #app > section.box > h3, #app > section.box > .head > h3 { font: 600 1.05rem/1.2 var(--f-head) !important; text-transform: uppercase; letter-spacing: -.01em !important }
/* page change: a quick rise, no blur (blur on every block made navigation feel slow) */
@keyframes pageIn { from { opacity: 0; transform: translateY(10px) } }
#app.enter > * { animation: pageIn .5s var(--ease) both }
/* small team tag in chips and the captain mark: readable, not squeezed into a circle */

@media (min-width: 761px) and (max-width: 960px) { header .me > span:not(.ava), header .steam-l { display: none } header .btn.steam { padding: .6rem .7rem } }
/* hover for the quiet links that had none */

.logo:hover, .flogo:hover { opacity: .8 }

/* invite list: search on top, five rows visible, one button per driver */

.inv-list { list-style: none; margin: 0; padding: 4px; display: grid; gap: 2px; max-height: calc(5 * 3.1rem + 8px); overflow-y: auto; overscroll-behavior: contain; border: 1px solid var(--line-2); border-radius: 4px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent }
.inv-list li { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; align-items: center; gap: .8rem; min-height: 3.1rem; padding: 0 .4rem 0 .7rem; border-radius: 3px; transition: background-color .2s }

.inv-num { font: 600 .8rem var(--f-head); color: var(--accent) }

.inv-who span { font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
/* background number: translucent digits must not overlap, or the overlap shows as a darker patch */

/* Steam avatars */

/* partners on the home page */
.spons { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: color-mix(in srgb, var(--panel) 60%, transparent) }
.sp-card { display: grid; justify-items: center; align-content: center; gap: .5rem; padding: 2rem 1rem; text-align: center; text-decoration: none; color: var(--text); border-right: 1px solid var(--line); margin-right: -1px; transition: background .25s }
a.sp-card:hover { background: color-mix(in srgb, var(--accent) 6%, transparent) }
.sp-card .sp-logo { margin-bottom: .6rem }

.sp-logo { width: 64px; height: 64px; display: grid; place-items: center; border: 1.5px solid var(--accent); border-radius: 6px; background: #0b0b0d; overflow: hidden; font: 800 .9rem var(--f-body); color: var(--accent) }
.sp-logo img { width: 100%; height: 100%; object-fit: contain; padding: 6px }

.sp-ed { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1.2rem; align-items: start }
.sp-ed-logo { display: grid; justify-items: center; gap: .5rem; width: 8rem } .sp-ed-logo .sp-logo { width: 96px; height: 96px }

/* small avatar in tables */
.t-ava { display: inline-grid; place-items: center; width: 26px; height: 26px; margin-right: .55rem; vertical-align: middle; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); font-size: .7rem; font-weight: 700; color: var(--soft) }
/* bracket */
.br-box > summary { cursor: pointer; list-style: none } .br-box > summary::-webkit-details-marker { display: none }
.br-box[open] > summary { margin-bottom: 1rem }
.br-box[open] .ach-chev { transform: rotate(180deg) } .br-box > summary:hover .ach-chev { border-color: var(--accent) }
/* five equal columns that always fit the width; every match sits in an equal slot, so a pair's two slots meet exactly

.bracket.b2 { grid-template-columns: repeat(2, minmax(0, 1fr)) } .bracket.b3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.br-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem }
.br-group { border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1rem 1rem; background: color-mix(in srgb, var(--bg) 40%, transparent) }
.br-gh { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem; margin-bottom: .8rem }

.br-play { margin-top: 1rem }

.br-col { display: flex; flex-direction: column; gap: .7rem; min-width: 0 }

.br-col:not(:last-child) .bs::after { content: ""; position: absolute; left: 100%; width: calc(var(--g) / 2); height: 50%; border-right: 1px solid var(--ln); pointer-events: none }
.br-col:not(:last-child) .bs:nth-child(odd)::after { top: 50%; border-top: 1px solid var(--ln) }
.br-col:not(:last-child) .bs:nth-child(even)::after { bottom: 50%; border-bottom: 1px solid var(--ln) }

  .br-col > .label { font-size: .5rem !important } .bm-pick { width: 1.1rem; height: 1.1rem; font-size: .55rem } }

// ---- add a stage to the viewer's calendar: Google Calendar event template, 4 hours from the start (UTC) ----
function calUrl(x) {
  const at = x && startOf(x);
  if (!at) return "#";
  const d = new Date(at), f = v => v.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const q = new URLSearchParams({ action: "TEMPLATE", text: `LDS · ${t("stage")} ${x.stage} · ${x.track}`, dates: `${f(d)}/${f(new Date(+d + 4 * 3600e3))}`, details: "Lateral Drift Series · CarX Drift Racing Online 2" });
  return "https://calendar.google.com/calendar/render?" + q;
}

function textToHtml(text) {
  const out = [], lines = String(text || "").split(/\r?\n/);
  let list = [], table = [], para = [];
  const flush = () => {
    if (para.length) out.push(`<p>${para.map(inlineMd).join("<br>")}</p>`), para = [];
    if (list.length) out.push(`<ul>${list.map(l => `<li>${inlineMd(l)}</li>`).join("")}</ul>`), list = [];
    if (table.length) {
      const rows = table.map(r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
      // a short row stretches its last cell, so every row's line runs the full width of the table
      const w = rows[0].length, cells = r => r.map((c, j) => `<td${j === r.length - 1 && r.length < w ? ` colspan="${w - r.length + 1}"` : ""}>${inlineMd(c)}</td>`).join("");
      out.push(`<div class="tablebox"><table><thead><tr>${rows[0].map(c => `<th>${inlineMd(c)}</th>`).join("")}</tr></thead><tbody>${
        rows.slice(1).map(r => `<tr>${cells(r)}</tr>`).join("")}</tbody></table></div>`);
      table = [];
    }
  };
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) { flush(); continue; }
    if (l.startsWith("- ")) { if (para.length || table.length) flush(); list.push(l.slice(2)); continue; }
    if (l.startsWith("|")) { if (para.length || list.length) flush(); table.push(l); continue; }
    flush();
    if (l.startsWith("## ")) out.push(`<h4>${inlineMd(l.slice(3))}</h4>`);
    else if (l.startsWith("! ")) out.push(`<div class="warn">${inlineMd(l.slice(2))}</div>`);
    else para.push(l);
  }
  flush();
  return out.join("");
}

function htmlToText(html) {
  if (typeof DOMParser === "undefined") return String(html).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  const root = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html").body.firstChild;
  const inline = el => [...el.childNodes].map(n => n.nodeName === "B" ? `**${n.textContent.trim()}**` : n.textContent).join("").replace(/\s+/g, " ").trim();
  return [...root.children].map(el => {
    if (el.tagName === "H4") return "## " + inline(el);
    if (el.tagName === "UL") return [...el.children].map(li => "- " + inline(li)).join("\n");
    if (el.classList.contains("warn")) return "! " + inline(el);
    if (el.classList.contains("tablebox")) return [...el.querySelectorAll("tr")].map(tr => "| " + [...tr.children].map(inline).join(" | ") + " |").join("\n");
    return inline(el);
  }).join("\n\n");
}

// an uploaded image becomes a small 256×256 data URL: team logos are cropped to a square, sponsor logos fit whole (transparent edges)
function readLogo(fileObj, done, fail, fit = false) {
  if (!/^image\/(png|jpeg|webp)$/.test(fileObj?.type || "") || fileObj.size > 5 * 1024 * 1024) return fail();
  const url = URL.createObjectURL(fileObj), img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"), n = 256, w = img.naturalWidth, h = img.naturalHeight, side = Math.min(w, h), k = n / Math.max(w, h);
    c.width = c.height = n;
    if (fit) c.getContext("2d").drawImage(img, (n - w * k) / 2, (n - h * k) / 2, w * k, h * k);
    else c.getContext("2d").drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, n, n);
    let data = c.toDataURL("image/webp", .85);
    if (!data.startsWith("data:image/webp")) data = fit ? c.toDataURL("image/png") : c.toDataURL("image/jpeg", .85);
    URL.revokeObjectURL(url);
    done(data);
  };
  img.onerror = () => { URL.revokeObjectURL(url); fail(); };
  img.src = url;
}

setInterval(() => {
  if (location.hash.startsWith("#obs-") && ovShown.grid && (Date.now() - gridActiveAt >= GRID_IDLE_MS) !== gridIdlePrev) render();
}, 1000);
function obsView(kind) {
  const st = bcState(), x = bcTour(st);
  if (!x) return "";
  const rows = bcRows(x), prev = ovPrev, res = judgeResult(st.votes);
  const bestOf = name => rows.find(r => r.name === name)?.best;
  const fx = {
    plate: { in: !ovShown.plate || prev?.onTrack !== st.onTrack || prev?.tour !== x.id, bump: !!prev && prev.onTrack === st.onTrack && prev.best[st.onTrack] !== bestOf(st.onTrack) },
    grid: { in: !ovShown.grid || prev?.tour !== x.id, flash: new Set(prev ? rows.filter(r => prev.best[r.name] !== r.best).map(r => r.name) : []) },
    battle: { in: !ovShown.battle || prev?.leader !== st.leader || prev?.chaser !== st.chaser || prev?.tour !== x.id,
      pop: new Set([...st.votes.map((v, j) => prev && v && prev.votes[j] !== v ? j : null).filter(j => j !== null), ...(prev && res !== "pending" && prev.res !== res ? ["result"] : [])]) },
  };

}

// background: a quiet lava lamp — a few warm blobs rise, sink and merge (metaballs on a small canvas, scaled up and softened);
// ~25 fps, paused when hidden or on OBS pages, one still frame with reduced motion
(() => {
  const cv = document.getElementById("lava"), cx = cv?.getContext("2d");
  if (!cx) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches, K = 8; // one canvas pixel per 8 screen pixels
  const blobs = Array.from({ length: 6 }, (_, i) => ({ x: .1 + i / 5 * .8 + (Math.random() - .5) * .06, r: .11 + Math.random() * .07,
    sp: .02 + Math.random() * .022, ph: Math.random() * 6.28, sx: .25 + Math.random() * .35 }));

  const fit = () => { W = cv.width = Math.max(1, Math.ceil(innerWidth / K)); H = cv.height = Math.max(1, Math.ceil(innerHeight / K)); img = cx.createImageData(W, H); };
  const draw = now => {
    const t = now / 1000, d = img.data, A = W / H, sc = Math.min(1, A * .8); // narrow screens get smaller wax
    // each blob travels the full height and a little beyond, like wax in a lamp; radius breathes slightly
    const bs = blobs.map(b => ({ x: (b.x + Math.sin(t * b.sp * 1.7 + b.ph) * .05) * A, y: .5 + .62 * Math.sin(t * b.sp + b.ph), r2: (b.r * sc * (1 + .15 * Math.sin(t * b.sx + b.ph))) ** 2 }));
    for (let py = 0, o = 0; py < H; py++) {
      const y = py / H;
      for (let px = 0; px < W; px++, o += 4) {
        const x = px / H;
        let f = 0;
        for (const b of bs) { const dx = x - b.x, dy = y - b.y; f += b.r2 / (dx * dx + dy * dy + 1e-4); }
        const a = Math.min(1, Math.max(0, (f - .9) / .22)), core = Math.min(1, Math.max(0, (f - 1.1) / 3)); // soft edge, brighter middle
        d[o] = 150 + 105 * core; d[o + 1] = 32 + 72 * core; d[o + 2] = 10 * core; d[o + 3] = a * 255;
      }
    }
    cx.putImageData(img, 0, 0);
  };
  fit();
  addEventListener("resize", () => { fit(); if (still) draw(30000); });
  document.documentElement.classList.add("has-lava");
  if (still) return draw(30000);
  const loop = now => {
    requestAnimationFrame(loop);
    if (document.hidden || document.body.classList.contains("obs") || now - last < 40) return;
    last = now; draw(now);
  };
  requestAnimationFrame(loop);
})();


addEventListener("hashchange", () => { pending = null; protestMsg = ""; render(true); scrollTo(0, 0); });
render(true);
</script>
