.pp-role { position: absolute; top: 1.4rem; right: 1.4rem; z-index: 2; display: inline-flex; align-items: center; gap: .45rem; padding: .4rem .8rem; border: 1px solid var(--line-2); border-radius: 999px; background: color-mix(in srgb, var(--bg) 60%, transparent); font: 500 .66rem/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--soft) }
.pp-role::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.pp-role.admin { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent) }
.pp-role.admin::before { box-shadow: 0 0 8px currentColor }
@media (max-width: 640px) { .pp-role { top: 1rem; right: 1rem } }

/* ---- broadcast overlays in the site style: flat black panels, thin lines, one orange accent, Unbounded for names and numbers;
   motion is the site's: short rises, an accent bar that draws in, colour flashes instead of glows ---- */
.ov-card, .ov-battle, .ov-preview { --f-display: var(--f-body) }
.ov-card { border-radius: var(--r); border: 1px solid var(--line); background: rgba(8, 8, 9, .94); box-shadow: 0 24px 60px -30px rgba(0, 0, 0, .9) }
.ov-card::before { right: auto; width: 56px; height: 2px; background: var(--accent); opacity: 1 }
.ov-card::after { display: none }
.ov-logo { height: 24px; padding: 0 8px; border-radius: 3px; background: var(--accent); color: var(--accent-ink); font: 700 12px/1 var(--f-head); letter-spacing: .02em; box-shadow: none }
.ov-label { font: 500 11px/1.2 var(--f-body); letter-spacing: .2em; color: var(--muted) }
.ov-live { font: 600 10px var(--f-body); letter-spacing: .22em }
.ov-live i { box-shadow: none }
.ov-ava { font: 600 1em/1 var(--f-head); background: var(--panel-2); box-shadow: 0 0 0 1px color-mix(in srgb, currentColor 55%, var(--line)) }
.ov-info b { font-family: var(--f-head); font-weight: 600; text-transform: uppercase; letter-spacing: -.01em }
.ov-info span { font-family: var(--f-body); color: var(--muted) }
.ov-plate .ov-info b { font-size: 34px }
.ov-runs span { border-radius: 3px; border-color: var(--line); background: transparent; font-family: var(--f-body) !important }
.ov-best small { font-family: var(--f-body); letter-spacing: .2em }
.ov-best b { font: 600 56px/.9 var(--f-head); letter-spacing: -.03em; text-shadow: none; color: var(--accent) }
.ov-line { display: none }
/* grid */
.ov-gh { border-bottom-color: var(--line) }
.ov-gh b { font: 600 17px/1.2 var(--f-head); text-transform: uppercase; letter-spacing: -.01em }
.ov-grid li { border-radius: 3px; font-family: var(--f-body) }
.ov-grid li:nth-child(even) { background: rgba(255, 255, 255, .018) }
.ov-grid li.first { background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: inset 2px 0 0 var(--accent) }
.ov-grid li.on { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent) }
.ov-grid li.on .nm::after { box-shadow: none }
.ov-grid .num { font: 600 15px/1 var(--f-head); letter-spacing: 0 }
.ov-grid .best { font: 600 15px var(--f-head) }
/* battle */
.ov-side.chaser { color: var(--silver) }
.ov-side .ov-info b { font-size: 22px }
.ov-side .ov-best b { font-size: 36px }
.ov-side.leader .ov-best b { color: var(--accent) } .ov-side.chaser .ov-best b { color: var(--silver) }
.ov-side.chaser::before { left: auto; right: 0; background: var(--silver) }
.ov-side.win { border-color: currentColor; animation: none }
.ov-side.win::before { width: 100% }
.ov-vs { font: 600 28px/1 var(--f-head); color: var(--muted); background: none; -webkit-background-clip: border-box; background-clip: border-box }
.ov-vote { border-radius: 3px; border-color: var(--line); background: transparent; font-family: var(--f-body) }
.ov-vote b { font-family: var(--f-head); font-size: 12px }
.ov-vote.leader { background: color-mix(in srgb, var(--accent) 10%, transparent) }
.ov-vote.chaser { border-color: color-mix(in srgb, var(--silver) 45%, var(--line)); background: color-mix(in srgb, var(--silver) 7%, transparent) } .ov-vote.chaser b { color: var(--silver) }
.ov-result { border-radius: 3px; font: 600 11px/1.2 var(--f-body); letter-spacing: .16em }
.ov-result::after { display: none }
.ov-result.leader { background: var(--accent); box-shadow: none }
.ov-result.chaser { background: var(--silver); box-shadow: none }
/* motion, same vocabulary as the site */
@keyframes ovIn { from { opacity: 0; transform: translateY(14px) } }
@keyframes ovInL { from { opacity: 0; transform: translateX(-24px) } }
@keyframes ovInR { from { opacity: 0; transform: translateX(24px) } }
@keyframes ovInC { from { opacity: 0; transform: translateY(10px) } }
@keyframes ovEdge { from { transform: scaleX(0) } }
@keyframes ovRow { from { opacity: 0; transform: translateY(6px) } }
@keyframes bump { 30% { transform: scale(1.06); color: var(--text) } }
@keyframes flash { 0%, 35% { background: color-mix(in srgb, var(--accent) 18%, transparent) } }
@keyframes pop { from { opacity: 0; transform: scale(.94) } }
.ov-stage .ov-card.in, .ov-stage .ov-battle.in .ov-card { animation: ovIn .6s var(--ease) both }
.ov-stage .ov-battle.in .ov-side.leader { animation: ovInL .6s var(--ease) both }
.ov-stage .ov-battle.in .ov-side.chaser { animation: ovInR .6s var(--ease) both }
.ov-stage .ov-battle.in .ov-mid { animation: ovInC .5s var(--ease) .1s both }
.ov-stage .in::before, .ov-stage .in .ov-card::before { animation: ovEdge .7s var(--ease) .2s both }
.ov-stage .in li { animation: ovRow .45s var(--ease) both; animation-delay: calc(min(var(--i, 0), 16) * 30ms + .2s) }
/* OBS page = a 1920×1080 canvas scaled to the window (--ovk), so the corners and sizes hold for any browser-source size:
   grid in the top-right corner, driver plate bottom-left, tandem plate bottom-centre; the two plates share one size */
.ov-stage { zoom: var(--ovk, 1) }
.ov-stage .ov-plate { width: 760px; max-width: none } .ov-stage .ov-battle, .ov-stage.ov-all .ov-battle { width: 1040px; max-width: none }
.ov-stage .ov-plate { left: 60px; bottom: 60px; top: auto }
.ov-stage .ov-battle, .ov-stage.ov-all .ov-battle { left: 50%; bottom: 60px; top: auto; translate: -50% 0 }
.ov-stage .ov-grid { right: 60px; top: 60px; width: 520px; max-width: none }
.ov-stage .ov-battle, .ov-stage.ov-all .ov-battle { grid-template-columns: minmax(0, 1fr) 290px minmax(0, 1fr) }
.ov-stage .ov-side { min-height: 128px; gap: 12px; padding: 16px 18px } .ov-stage .ov-side .ov-ava { width: 60px; height: 60px }
/* long nicknames wrap to a second line instead of being cut */
.ov-stage .ov-side .ov-info b { font-size: 24px; line-height: 1.05; white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.ov-stage .ov-side .ov-best b { font-size: 40px } .ov-stage .ov-pair, .ov-stage .ov-label { font-size: 13px } .ov-stage .ov-vote b { font-size: 15px } .ov-stage .ov-result { font-size: 14px }
.ov-stage .ov-grid .nm { font-size: 17px } .ov-stage .ov-grid .best { font-size: 18px }
/* sizes from the broadcast panel; each overlay grows from its own corner */
.ov-stage .ov-plate { scale: var(--s-plate, 1); transform-origin: 0 100% }
.ov-stage .ov-grid { scale: var(--s-grid, 1); transform-origin: 100% 0 }
.ov-stage .ov-battle { scale: var(--s-battle, 1); transform-origin: 50% 100% }
/* broadcast panel: the three overlays side by side, previews shrunk to fit their card */
.bc-ovs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.2rem; align-items: start }
@media (max-width: 1100px) { .bc-ovs { grid-template-columns: minmax(0, 1fr) } }
/* ---- audit fixes ---- */
/* stage page: folding blocks sit close together like one group, not 72 px apart */
#app > .br-box + .br-box, #app > .br-box + section.stack, #app > section.stack + .br-box, #app > .tw-box + .br-box { margin-top: calc(1.4rem - 4.5rem) }
@media (max-width: 760px) { #app > .br-box + .br-box, #app > .br-box + section.stack, #app > section.stack + .br-box, #app > .tw-box + .br-box { margin-top: calc(1.2rem - 3.25rem) } }
/* leaderboard: team and car wrap to a second line instead of being cut */
.lb-sub { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
/* judges island on a phone: each judge on its own line, the three vote buttons share the width */
@media (max-width: 600px) { .judge-row { grid-template-columns: minmax(0, 1fr) !important; gap: .4rem } .judge-row .seg { grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100% } .judge-row .seg button { min-width: 0; padding-inline: .3rem; overflow: hidden; text-overflow: ellipsis } }
/* admin menu on a phone: the role line spans the row so the menu items stay in even pairs */
@media (max-width: 860px) { .adm-side > .note { grid-column: 1 / -1; margin-top: -.4rem } }
/* phone: folding block titles keep one line with the arrow; the long "preliminary" hint is dropped there */
@media (max-width: 600px) { .br-box > summary .br-note { display: none } .br-box > summary.psec-head { flex-wrap: nowrap; align-items: center } .br-box > summary.psec-head > :first-child { min-width: 0 } .br-box > summary .row { flex-wrap: nowrap; flex: 0 0 auto } }
/* phone menu: room after the last item so it can scroll clear of the edge fade */
@media (max-width: 760px) { nav { padding-right: 2.5rem } }
/* a folded block is as tall above its title as below (the empty content no longer adds a grid gap); open spacing comes from the summary margin */
.br-box { row-gap: 0 }
/* their titles use the same type as every other block title (profile, cards, tracks) */
.br-box > summary h3 { font: 600 1rem/1.25 var(--f-head) !important; letter-spacing: -.01em }
/* lists and tables rise in one after another on navigation, like the card grids */
.enter :is(.pl-grid, .ach-grid, .treg-list, .tablebox tbody, .bc-ovs, .ready-btns) > * { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(min(var(--i, 0), 14) * 35ms + .15s) }
@media (prefers-reduced-motion: reduce) { .enter :is(.pl-grid, .ach-grid, .treg-list, .tablebox tbody, .bc-ovs, .ready-btns) > * { animation: none } }
.bc-ovs .bc-ov { gap: .9rem } .bc-ovs .car-form { grid-template-columns: 1fr }
.bc-ovs .ov-preview { overflow: hidden; padding: 12px }
.bc-ovs .ov-preview:has(.ov-grid) { max-height: 260px; mask-image: linear-gradient(#000 78%, transparent) } /* the long grid shows its top rows only */
.bc-ovs .ov-plate { width: 760px; max-width: none } .bc-ovs .ov-battle { width: 1040px; max-width: none } .bc-ovs .ov-grid { width: 520px; max-width: none }
.bc-size { display: grid; grid-template-columns: auto 1fr 3.2rem; align-items: center; gap: .8rem }
.bc-size input { width: 100%; accent-color: var(--accent) } .bc-size output { text-align: right; color: var(--accent); font-size: .8rem }
/* the panel: cards keep their own height, previews sit on the site grid instead of a checkerboard */
.bc-top { align-items: start }
.ov-preview { background: linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px) 0 0 / 24px 24px, #070708 }
/* ---- finishing pass ---- */
/* one floor for micro type: uppercase labels, table heads, pills and small buttons never drop under 11px */
.label, th, .pill, .tm-status, .curtag, .toc .sep, .adminbadge, .specs dt, .pp-stats dt, .pp-car dt, .spec dt, .diff-row dt, .h6-code, .tk-row .label { font-size: .6875rem !important }
.btn { font-size: .72rem !important } .btn.text { font-size: .8rem !important }
.lb-sub { font-size: .75rem !important }
.ov-vote { font-size: 10px }
/* grid children may shrink: wide overlay previews scroll inside their card instead of widening the page */
#app > * { min-width: 0 }
.ov-preview { overflow-x: auto; min-width: 0 }
.h6-title em { font-size: max(.6875rem, .11em) !important }
@media (max-width: 640px) { .h6-stage { min-height: 240px; padding: 1.5rem 0 } }
@media (max-width: 640px) { .sec-head { grid-template-columns: minmax(0, 1fr); align-items: start } .sec-head > :not(.idx):not(h2) { justify-self: start } }
/* stats rows hold three numbers now: three even columns everywhere */
.pp-stats { grid-template-columns: repeat(3, minmax(0, 1fr)) !important }
@media (max-width: 640px) {
  .pp-stats { gap: .9rem } .pp-stats dd { font-size: 1.35rem !important }
  .pp-who h1 { font-size: clamp(1.6rem, 8.2vw, 2.4rem) !important }
}
.adm-side .bc-link, .adm-side > .label { grid-column: 1 / -1 }
/* section titles on the stage page match the card titles elsewhere */
#app > section.stack > h3, #app > section.stack > div > h3, #app > section.box > h3, #app > section.box > .head > h3 { font: 600 1.05rem/1.2 var(--f-head) !important; text-transform: uppercase; letter-spacing: -.01em !important }
/* page change: a quick rise, no blur (blur on every block made navigation feel slow) */
@keyframes pageIn { from { opacity: 0; transform: translateY(10px) } }
#app.enter > * { animation: pageIn .5s var(--ease) both }
/* small team tag in chips and the captain mark: readable, not squeezed into a circle */
.chip4 .tlogo:not(.has-img) { width: auto; min-width: 26px; height: 22px; padding: 0 6px; border-radius: 5px; font-size: .6875rem !important }
.cap { font-size: .6875rem !important; padding: .28rem .42rem }
/* tablet header: the avatar alone stands for the account, so the nav keeps its room */
@media (min-width: 761px) and (max-width: 960px) { header .me > span:not(.ava), header .steam-l { display: none } header .btn.steam { padding: .6rem .7rem } }
/* hover for the quiet links that had none */
.back, .logo, .flogo, .me, .lang button, .linkbtn { transition: color .2s, opacity .2s }
.back:hover { color: var(--text) }
.logo:hover, .flogo:hover { opacity: .8 }
.me:hover > span:not(.ava) { color: var(--accent) } .me .ava { transition: border-color .2s } .me:hover .ava { border-color: var(--accent) }
.lang button:hover { color: var(--text) }

const staffTeam = () => ({ id: STAFF_ID, name: t("staffName"), tag: "LDS", desc: t("staffDesc"), staff: true, img: STAFF_IMG });
const teamById = id => id === STAFF_ID ? staffTeam() : allTeams().find(x => x.id === id);
const logo = tm => /^data:image\/(webp|jpeg|png);base64,/.test(tm.img || "")
  ? `<span class="tlogo has-img" style="background-image:url(${tm.img})" role="img" aria-label="${esc(tm.tag)}"></span>`
  : `<span class="tlogo">${esc(tm.tag)}</span>`;
const me = () => S.user && { name: S.user.name, avatar: S.user.avatar, about: S.about, setup: S.car, rating: HOSTED ? 0 : S.myRating ?? ME_RATING, team: S.team, num: S.num, car: S.car.car, mine: true };
const roster = () => [...PILOTS, ...(me() ? [me()] : [])];
// admin-entered score wins, otherwise a generated example; k = 0 for run 1, 1 for run 2
const runOf = (tid, p, i, k) => { const o = S.scores[`${tid}:${p.name}`]; return o && k in o ? o[k] : score(tid * 100 + i + k * 50); };
// reg and qualifying stages show only scores the judges entered; running and finished stages fall back to generated examples
// the hosted site never invents scores: only what the judges entered
const scoreOf = (x, p, i, k) => HOSTED || x.status === "soon" || x.status === "reg" || x.status === "qualifying" ? (S.scores[`${x.id}:${p.name}`]?.[k] ?? null) : runOf(x.id, p, i, k);
const taken = () => new Set(PILOTS.map(p => p.num));
// the pilot who created a team stays its founder: listed first and marked everywhere
const founderName = tm => founderOf(tm)?.name || null;
const STAFF_RANK = r => ["owner", ...ROLE_LIST].indexOf(r);
const membersOf = tm => { if (tm.staff) return roster().filter(p => !p.test && roleOf(p.name)).sort((a, b) => STAFF_RANK(roleOf(a.name)) - STAFF_RANK(roleOf(b.name)) || a.name.localeCompare(b.name));
  const f = founderName(tm); return roster().filter(p => p.team === tm.id).sort((a, b) => (b.name === f) - (a.name === f) || b.rating - a.rating); };
// one-letter marks: C = founder, R = representative (one per team, picked by the founder)
const repName = tm => tm.rep && tm.rep !== founderName(tm) && roster().some(p => p.team === tm.id && p.name === tm.rep) ? tm.rep : null;

const achUnlocked = name => new Set(ACHIEVEMENTS.filter(a => AWARDS[a[1]]?.includes(name)).map(a => a[1]));
// teams get achievements too: stored with the pilots' as "t:<teamId>"
// an achievement is for pilots (shown in profiles) or for teams (shown on team pages); older ones handed only to teams count as team ones
const achKind = a => a[4] || ((h => h.length && h.every(x => x.startsWith("t:")))(AWARDS[a[1]] || []) ? "team" : "pilot");
const pilotAch = () => ACHIEVEMENTS.filter(a => achKind(a) === "pilot");
const teamAchList = tm => ACHIEVEMENTS.filter(a => achKind(a) === "team" && AWARDS[a[1]]?.includes(`t:${tm.id}`));
const achHolder = h => h.startsWith("t:") ? `🏁 ${teamById(+h.slice(2))?.name ?? "?"}` : h;
// one look for pilots and teams: every achievement of the kind, the earned ones lit, with an earned/total count
const achGrid = (list, got) => { const lang = S.lang === "en" ? 3 : 2;
  if (!list.length) return `<p class="note">${t("noAch")}</p>`;
  const veiled = a => !!a[5] && !got.has(a[1]);
  return `<div class="ach-grid">${[...list.filter(a => !veiled(a)), ...list.filter(veiled)].map(a => { const on = got.has(a[1]), v = veiled(a);
    const title = v ? "???" : a[lang][0] || tr(a[2][0]), desc = v ? t("achHiddenD") : a[lang][1] || tr(a[2][1]);
    return `<div class="ach ${on ? "on" : ""} ${v ? "veiled" : ""}" title="${on ? t("achOn") : t("achOff")}"><span class="ach-ic" aria-hidden="true">${v ? "?" : esc(a[0])}</span><span><b>${esc(title)}</b><span class="ach-d">${esc(desc)}</span></span></div>`; }).join("")}</div>`; };
const achTally = (list, got) => `<span class="ach-count">${list.filter(a => got.has(a[1])).length}<span>/${list.length}</span></span>`;
const achBlock = name => achGrid(pilotAch(), achUnlocked(name));
const achCount = name => achTally(pilotAch(), achUnlocked(name));
const teamAchGot = tm => new Set(teamAchList(tm).map(a => a[1]));

function profile() {

  // a claimed number stays with the pilot for the whole season; only the head admin changes it
  const p = roster().find(z => z.mine), tk = taken(), locked = S.num != null, about = S.about || {};
  const counter = key => `<span class="counter" id="cnt-${key}">${Math.min((about[key] || "").length, ABOUT_MAX)} / ${ABOUT_MAX}</span>`;
  return `<div class="pp-bar"><span class="label">${t("myProfile")}</span>
    <div class="row" style="gap:1rem"><a class="btn text sm" href="${pHref(p.name)}">${t("publicView")} ↗</a>
      ${Object.keys(ROLES).length || HOSTED ? "" : `<button class="btn text sm" data-act="toggleAdmin">${t("adminFirst")}</button>`}<button class="btn line sm" data-act="logout">${t("logout")}</button></div></div>
  ${pilotHero(p, true)}

  <details class="psec panel ach-box" id="ach-box" ${S.achOpen ? "open" : ""}><summary class="psec-head"><h3>${t("achievements")}</h3><span class="row" style="gap:1rem">${achCount(S.user.name)}<i class="ach-chev" aria-hidden="true"></i></span></summary>${achBlock(S.user.name)}</details>
  ${stageRegBox()}
  <div class="pp-pair">
    ${psec(t("numReg"), `<div class="num-wrap"><div class="stack" style="gap:.8rem"><div class="numshow ${S.num != null ? "" : "none"}" id="numshow">${numInner(S.num)}${locked ? '<span class="lock" aria-hidden="true">🔒</span>' : ""}</div>
      <p class="note">${locked ? t("numLocked") : t("numHint")}</p>
      ${locked ? "" : `<form class="numcustom" id="numform"><label for="own" class="note">${t("own")}</label>
        <input id="own" type="number" min="1" max="999" inputmode="numeric" placeholder="1–999"><button class="btn line sm" id="numtake">${t("take")}</button></form>
      <span class="note err" role="status" id="nummsg"></span>`}</div>
    ${locked ? "" : `<div class="numgrid" id="numgrid">${Array.from({ length: 100 }, (_, i) => i + 1).map(v =>
      `<button data-num="${v}" ${tk.has(v) ? "disabled" : ""} aria-pressed="${S.num === v}">${v}</button>`).join("")}</div>`}</div>`)}
    ${psec(t("aboutMe"), `<label class="fieldlabel pp-about"><textarea id="about-ru" aria-label="${t("aboutMe")}" data-about="ru" maxlength="${ABOUT_MAX}" placeholder="${t("aboutPh")}">${esc((about.ru || "").slice(0, ABOUT_MAX))}</textarea>${counter("ru")}</label>
      <div class="warn">⚠ ${t("aboutRules")}</div>`)}
  </div>
  <div class="pp-pair">
    ${psec(t("myTeam"), myTeamBox())}
    ${psec(t("car"), `<div class="car-stack">${partPicker("car", CARS, "car")}${partPicker("engine", ENGINES, "engine")}${partPicker("gearbox", GEARBOXES, "gearbox")}
      <label class="cpick-hp" for="car-hp"><span class="label">${t("hpLong")}</span><input class="field" id="car-hp" type="number" min="${SETTINGS.hpMin}" max="${SETTINGS.hpMax}" step="1" data-car="hp" value="${esc(S.car.hp)}" placeholder="${SETTINGS.hpMin}–${SETTINGS.hpMax}">
        <span class="note ${hpOk() ? "" : "err"}">${t("hpRule")} ${SETTINGS.hpMin}–${SETTINGS.hpMax}</span></label>
      <label class="cpick-hp" for="car-kg"><span class="label">${t("kgLong")}</span><input class="field" id="car-kg" type="number" min="${SETTINGS.kgMin}" max="${SETTINGS.kgMax}" step="1" data-car="kg" value="${esc(S.car.kg ?? "")}" placeholder="${SETTINGS.kgMin}–${SETTINGS.kgMax}">
        <span class="note ${kgOk() ? "" : "err"}">${t("kgRule")} ${SETTINGS.kgMin}–${SETTINGS.kgMax}</span></label></div>
    ${carOk() ? "" : `<p class="note err">${t("needCarHere")}</p>`}`)}

}

// shortcut: admin role is a client-side demo toggle; real admin rights must be checked on a server
// admAnim: set when the admin moves to another section, so only navigation animates, not every saved field
let admAnim = false, admView = "", admLevel = "", animKeep = ""; // animKeep: a selector whose entry animation the next render lets play
let aEditTeam = 0, aTab = "seasons", aSeason = 0, aTour = 0, aSub = "main", adminMsg = "", pending = null;
const stageMax = x => x.max ?? SETTINGS.maxStage; // per stage, falling back to the settings default
const stageTeamsMax = x => x.maxTeams ?? SETTINGS.maxTeamsStage; // teams per stage, set on the stage's "Основное"
const sel = (attr, list, cur, label, cls = "ai wide") => `<select class="${cls}" data-a="${attr}" aria-label="${label}">${list.map(s => `<option value="${s}" ${s === cur ? "selected" : ""}>${t(s)}</option>`).join("")}</select>`;

function adminSeasons() {
  const s = SEASONS.find(z => z.id === aSeason);
  const ed = can("edit");
  if (!s) return `<div class="head"><h2>${t("seasons")}</h2>${ed ? `<button class="btn" data-act="newSeason">${t("newSeason")}</button>` : ""}</div>
    <div class="tablebox panel"><table><thead><tr><th>${t("no")}</th><th>${t("seasonNameCol")}</th><th>${t("stagesCol")}</th><th>${t("status")}</th><th></th></tr></thead><tbody>${
      SEASONS.map(z => `<tr class="clickrow" data-season="${z.id}" tabindex="0"><td class="mono">${z.id}</td><td>${esc(z.name)}</td><td class="mono">${seasonTours(z.id).length}</td><td>${ed ? `<select class="st-sel" data-s="${z.status}" data-a="season:${z.id}:status" aria-label="${t("status")}">${["plan", "live", "done"].map(v => `<option value="${v}" ${v === z.status ? "selected" : ""}>${t(v)}</option>`).join("")}</select>` : seasonPill(z.status)}</td>
        <td class="acc" style="text-align:right">${t("configure")} →</td></tr>`).join("")}</tbody></table></div>`;
  const x = TOURS.find(z => z.id === aTour && z.season === s.id);
  if (x) return adminTour(x);
  const stages = seasonTours(s.id);
  return `${backBtn('data-season="0"', t("seasons"))}
    <div class="head"><h2>${esc(s.name)}</h2>${seasonPill(s.status)}</div>
    ${ed ? `<div class="box panel"><label class="fieldlabel" style="max-width:24rem">${t("seasonNameCol")}<input class="field" data-a="season:${s.id}:name" value="${esc(s.name)}" maxlength="40"></label></div>` : ""}
    <div class="head"><h3>${t("aStagesOf")}</h3>${ed && stages.length < 12 ? `<button class="btn line sm" data-act="addStage" data-id="${s.id}">${t("addStage")}</button>` : ""}</div>
    <div class="tablebox panel"><table class="stage-tbl"><thead><tr><th>${t("stage")}</th><th>${t("track")}</th><th>${t("status")}</th><th>${t("drivers")} / ${t("maxPilotsCol")}</th><th></th></tr></thead><tbody>${
      stages.map(z => `<tr class="clickrow" data-qt="${z.id}" tabindex="0"><td class="n">${z.stage}</td>
        <td><b class="st-track">${esc(z.track)}</b><span class="note mono">${esc(when(z))}</span></td>
        <td>${ed ? `<select class="st-sel" data-s="${z.status}" data-a="tour:${z.id}:status" aria-label="${t("status")}">${STATUSES.map(v => `<option value="${v}" ${v === z.status ? "selected" : ""}>${t(v)}</option>`).join("")}</select>` : tourPill(z)}</td>
        <td class="st-cap"><span class="mono">${stageRows(z).length}</span><span class="muted">/</span>${ed ? `<input class="ai" type="number" min="2" max="256" data-a="tour:${z.id}:max" value="${stageMax(z)}" aria-label="${t("maxPilotsCol")}">` : `<span class="mono muted">${stageMax(z)}</span>`}</td>
        <td class="st-go" aria-label="${t("configure")}"><span>→</span></td></tr>`).join("")}</tbody></table></div>
    <div>${!ed ? "" : s.status === "live" ? `<p class="note">${t("liveLocked")}</p>` : `<button class="btn text danger" data-act="delSeason" data-id="${s.id}">${pending === `s${s.id}` ? t("delSure") : t("delSeason")}</button>`}</div>`;
}

function adminTour(x) {

  const head = `${backBtn('data-qt="0"', esc(seasonName(x.season)))}
    <div class="head"><h2>${t("stage")} ${x.stage} · ${esc(x.track)}</h2>${tourPill(x)}</div>

  if (aSub === "main") body = `<div class="box panel"><div class="cols" style="gap:1rem">
      <div class="cols" style="gap:1rem"><label class="fieldlabel">${t("track")}<select class="field" data-a="tour:${x.id}:track">${[...new Set([...trackNames(), x.track])].map(n =>
        `<option value="${esc(n)}" ${n === x.track ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>
      ${confOf(x.track).length ? `<label class="fieldlabel">${t("trkConf")}<select class="field" data-a="tour:${x.id}:conf"><option value="">${t("trkMain")}</option>${partsOf(x.track).map(p => { const o = p.conf.map(c =>

      <label class="fieldlabel">${t("startAt")} · ${t("msk")}<input class="field" type="datetime-local" data-a="tour:${x.id}:start" value="${startOf({ start: x.start })?.slice(0, 16) || ""}"></label>
      <div class="cols" style="gap:1rem"><label class="fieldlabel">${t("seatsL")}<input class="field" type="number" min="2" max="256" data-a="tour:${x.id}:max" value="${stageMax(x)}"></label>
      <label class="fieldlabel">${t("maxTeamsStageL")}<input class="field" type="number" min="1" max="64" data-a="tour:${x.id}:maxTeams" value="${stageTeamsMax(x)}"></label></div>
</div></div>`;
  if (aSub === "qual") {
    const inp = (p, i, k) => { const v = scoreOf(x, p, i, k); return `<input class="ai" type="number" min="0" max="100" step="0.1" data-a="score:${x.id}:${k}:${i}" value="${v ?? ""}" aria-label="${esc(p.name)} ${k + 1}">`; };
    const opts = k => `<option value="">—</option>${stageRows(x).map(([p]) => p.name).sort((m, n) => m.localeCompare(n)).map(n => `<option ${swapSel[k] === n ? "selected" : ""}>${esc(n)}</option>`).join("")}`;
    body = `${can("edit") ? `<div class="box panel"><div class="stack" style="gap:.3rem"><h3>${t("swapTitle")}</h3><p class="note" style="margin:0">${t("swapHint")}</p></div>
      <div class="row swap-row"><select class="field" data-swap="a" aria-label="${t("pilot")} 1">${opts("a")}</select><span aria-hidden="true">⇄</span><select class="field" data-swap="b" aria-label="${t("pilot")} 2">${opts("b")}</select>
        <button class="btn line sm" data-act="swapPilots" data-id="${x.id}">${pending === `sw${x.id}` ? t("swapSure") : t("swapGo")}</button></div></div>` : ""}
    <p class="note">${t("qualHint")}</p><div class="tablebox panel"><table><thead><tr><th>${t("no")}</th><th>${t("pilot")}</th><th>${t("try1")}</th><th>${t("try2")}</th></tr></thead><tbody>${
      stageRows(x).map(([p, i]) => `<tr><td class="n">${p.num ?? "—"}</td><td>${esc(p.name)}</td><td>${inp(p, i, 0)}</td><td>${inp(p, i, 1)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  if (aSub === "pilots") { const inRows = new Set(stageRows(x).map(([p]) => p.name)), gm = gmaxOf(x);
    body = `<div class="box panel"><div class="stack" style="gap:.3rem"><h3>${t("groupLimits")}</h3><p class="note" style="margin:0">${t("groupsHint")}</p><div><button class="btn line sm" data-act="grpFromBr" data-id="${x.id}" title="${t("grpFromBrHint")}">${pending === `gb${x.id}` ? t("grpFromBrSure") : t("grpFromBr")}</button></div></div>
      <div class="grp-limits">${GROUPS.map(g => `<label class="fieldlabel"><span><span class="grp">${g}</span> ${groupCount(x, g)} / ${gm[g]}</span><input class="field" type="number" min="1" max="64" data-a="gmax:${x.id}:${g}" value="${gm[g]}" aria-label="${t("group")} ${g}"></label>`).join("")}</div></div>
    <p class="note">${t("pilotsHint")}</p><div class="tablebox panel"><table><thead><tr><th>${t("inStage")}</th><th>${t("no")}</th><th>${t("pilot")}</th><th>${t("team")}</th><th>${t("group")}</th></tr></thead><tbody>${
    roster().map((p, i) => `<tr><td><input type="checkbox" data-a="out:${x.id}:${i}" ${inRows.has(p.name) ? "checked" : ""} aria-label="${t("inStage")}: ${esc(p.name)}"></td>
      <td class="n">${p.num ?? "—"}</td><td>${esc(p.name)}${p.test ? ` <span class="label">${t("testTag")}</span>` : ""}${isBanned(p.name) ? ` <span class="pill plain err" style="font-size:.65rem">${t("ban")}</span>` : ""}</td><td class="muted">${teamById(p.team) ? esc(teamById(p.team).name) : "—"}</td>
      <td><select class="ai" data-a="grp:${x.id}:${i}" ${inRows.has(p.name) ? "" : "disabled"} aria-label="${t("group")} ${esc(p.name)}"><option value="">—</option>${GROUPS.map(g => `<option ${groupOf(x, p.name) === g ? "selected" : ""}>${g}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>`; }
  if (aSub === "main") { const list = stageEntries(x), free = allTeams().filter(tm => !list.some(r => r.tm.id === tm.id)), editing = list.find(r => r.tm.id === aEditTeam);
    const reqs = allTeams().flatMap(tm => reqsOf(tm).filter(r => r.type === "roster" && r.tour === x.id).map(r => ({ tm, r })));
    const when = at => new Date(at).toLocaleString(S.lang === "en" ? "en-GB" : "ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });

        <td>${esc(nickTxt(r.e.founderNick))}</td><td style="white-space:normal">${r.e.pilots.map(p => esc(nickTxt(p.nick))).join(", ")}</td><td class="mono muted">${when(r.e.at)}</td>
        <td><div class="row" style="gap:.3rem;flex-wrap:nowrap"><button class="btn line sm" data-act="teamEdit" data-id="${r.tm.id}">${t("teamEdit")}</button>
          <button class="btn text sm danger" data-act="teamRemove" data-id="${r.tm.id}" data-v="${x.id}">${pending === `te${x.id}-${r.tm.id}` ? t("delSure") : t("del")}</button></div></td></tr>`).join("")
      || `<tr><td colspan="6" class="muted">${t("noEntries")}</td></tr>`}</tbody></table></div>
    ${editing ? `<div class="box panel"><div class="head"><h3>${esc(editing.tm.name)}</h3><button class="btn text sm" data-act="teamEdit" data-id="0">${t("cancel")}</button></div>${entryForm("tentryform", x, editing.tm, editing.e)}</div>` : ""}
    ${free.length ? `<div class="row" style="gap:.5rem"><select class="ai" id="teamadd" style="min-width:12rem" aria-label="${t("team")}">${free.map(tm => `<option value="${tm.id}">${esc(tm.name)}</option>`).join("")}</select>
      <button class="btn line sm" data-act="teamAdd" data-id="${x.id}">${t("teamAdd")}</button></div>` : ""}
    <section class="stack" style="gap:.6rem"><h3>${t("rosterReqs")}</h3>${reqs.length ? `<ul class="my-prot">${reqs.map(({ tm, r }) => `<li><b>${esc(tm.name)}</b><span>${reqText(r)}</span>${reqPill(tm, r)}
      ${reqStat(tm, r) === "new" ? `<span class="row" style="gap:.3rem;margin-left:auto"><button class="btn sm" data-act="reqApprove" data-id="${tm.id}" data-v="${r.id}">${t("reqApprove")}</button><button class="btn text sm danger" data-act="reqReject" data-id="${tm.id}" data-v="${r.id}">${t("reqReject")}</button></span>` : ""}</li>`).join("")}</ul>`
      : `<p class="note">${t("noReqs")}</p>`}</section></section>
    <div><button class="btn text danger" data-act="delStage" data-id="${x.id}">${pending === `st${x.id}` ? t("delSure") : t("delStage")}</button></div>`; }
  return head + body;
}

const sanctionLabel = s => (s.type === "dq" && s.tour ? `${t("dq")} · ${t("stage")} ${TOURS.find(x => x.id === s.tour)?.stage ?? "?"}` : t(s.type)) + (s.auto ? ` · ${t("sancAuto")}` : "");

function adminPilots() {
  const own = isOwner();
  return `<div class="head"><div class="stack" style="gap:.3rem"><h2>${t("aSanctions")}</h2><p class="note" style="margin:0">${t("dqNote")} <b>${t("sancRule")}</b>${own ? "" : ` ${t("ownerOnly")}`}</p></div>
      <button class="btn line" data-act="addTest">${t("addTestPilot")}</button></div>
    <div class="tablebox panel"><table><thead><tr><th>${t("numCol")}</th><th>${t("pilot")}</th><th>${t("sanctions")}</th><th></th></tr></thead><tbody>${roster().map((p, i) => {
      const key = p.mine ? "me" : i, kickKey = `kick-${p.name}`;
      const extra = p.test ? `<button class="btn text danger sm" data-act="delTest" data-name="${esc(p.name)}">${pending === kickKey ? t("delSure") : t("del")}</button>`

  if (location.hash === "#auth=failed") { history.replaceState(null, "", location.pathname + "#home"); setTimeout(() => toast(t("authFailed")), 300); }

// any open tab follows changes from other tabs; skipped while someone is typing in this one
function pullState() {
  if (HOSTED) return; // the API keeps tabs in step there
  const h = location.hash, live = h.startsWith("#obs-") || h === "#broadcast";
  if (!live && document.activeElement?.matches?.("input, textarea, select")) return;
  let raw = null;
  try { raw = localStorage.getItem("lds"); } catch { return; }
  if (!raw || raw === lastRaw) return;
  lastRaw = raw;
  try { reloadState(raw); render(); } catch {}
}
setInterval(pullState, 700);
addEventListener("storage", pullState);

// pilot card: keep the bio and garage clear of the background number (measured: its width depends on the loaded font)

    const n = h.querySelector(".pp-bgnum"), on = innerWidth > 640 && n?.textContent.trim();

      if (!isFounder(tm) || !ref || !membersOf(tm).some(p => p.name === to)) return;
      confirmTwice("fpass", () => { passTo = ""; ref.founder = isSrv(ref) ? USERS.find(u => u.name === to)?.steamId : to; if (ref.rep === to) delete ref.rep; if (TEAM_FOUNDERS[tm.id]) TEAM_FOUNDERS[tm.id] = to; toast(t("founderPassed")); saveTeam(); }); },
  })[el.dataset.act]?.();
  // the first press of a two-step action (delete, reset…) turned into "are you sure": nudge that button
  if (pending && pending !== asked) document.querySelector(Object.entries(el.dataset).map(([k, v]) => `[data-${k.replace(/[A-Z]/g, c => "-" + c.toLowerCase())}="${CSS.escape(v)}"]`).join(""))?.classList.add("asking");
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "numform") {
    const v = Number(document.getElementById("own").value);
    const err = !Number.isInteger(v) || v < 1 || v > 999 ? t("numBad") : taken().has(v) ? t("numTaken") : "";
    const m = document.getElementById("nummsg"), b = document.getElementById("numtake");
    if (err) { m.className = "note err"; m.textContent = err; }
    else if (numAsk !== v) { numAsk = v; b.textContent = t("numSure").replace("{n}", v); b.classList.remove("line"); b.classList.add("ask"); m.className = "note"; m.textContent = t("numSureHint"); }
    else { numAsk = null; pick = v; confirmNum(); }
  }
  if (e.target.id === "protestform" && S.user) {
    const text = document.getElementById("ptext").value.trim().slice(0, 500), against = document.getElementById("pagainst").value, x = TOURS.find(z => z.id === +e.target.dataset.tour);
    if (!text || !against || !x || !protestOpen(x)) return;
    if (myProtests(x).some(q => q.against === against && q.status === "new")) { protestMsg = t("protestDup"); return render(); }
    protestMsg = t("protestSent");
    if (HOSTED && !isAdmin()) { api("/api/protest", { method: "POST", body: JSON.stringify({ tour: +e.target.dataset.tour, against, text }) }).then(() => { apiV = null; }, () => toast(t("netErr"))); return render(); }
    PROTESTS.push({ id: Math.max(0, ...PROTESTS.map(p => p.id)) + 1, tour: +e.target.dataset.tour, from: S.user.name, against, text, status: "new", verdict: "" });
    dbSave();
  }
  if (e.target.matches?.(".treg-form")) {
    // a team entry: the founder while registration is open, or an organiser at any time
    const f = e.target, x = TOURS.find(z => z.id === +f.dataset.tour), tm = teamById(+f.dataset.team), fd = new FormData(f), byAdmin = f.id === "tentryform";
    const msg = m => { const el = document.getElementById(`${f.id}-msg`); if (el) el.textContent = m; };
    if (!x || !tm) return;
    const names = fd.getAll("p"), founderNick = nickTxt(fd.get("founder")).slice(0, 32);
    if (!founderNick) return msg(t("entryNeedFounder"));
    if (!names.length) return msg(t("entryNeedPilots"));
    if (names.length > SETTINGS.teamStageMax) return msg(`${t("entryTooMany")} ${SETTINGS.teamStageMax}`);
    const pilots = names.map(n => ({ name: n, nick: nickTxt(fd.get(`nick:${n}`)).slice(0, 32) || n }));
    const dup = inOtherEntry(x, tm, names);
    if (dup.length) return msg(`${t("entryDup")}: ${dup.join(", ")}`);
    if (byAdmin) { if (!isAdmin()) return; (TEAM_ENTRIES[x.id] ??= {})[tm.id] = { at: teamEntry(x, tm)?.at ?? Date.now(), founderNick, pilots }; aEditTeam = 0; toast(t("saved")); return dbSave(); }
    if (!isFounder(tm) || !teamRegOpen(x)) return;
    const regs = founderOf(tm)?.regs || {}, cur = regs[x.id];
    if (!cur && stageEntries(x).filter(r => r.ok).length >= stageTeamsMax(x)) return msg(t("teamRegFull"));
    toast(t("entrySaved"));
    return setRegs(tm, { ...regs, [x.id]: { at: cur?.at ?? Date.now(), founderNick, pilots } }); // edits keep the original filing time: earlier entries keep priority
  }
  if (e.target.id === "achgive" && isAdmin()) {
    // hand an achievement to a pilot (pilot list) or a team (team list), picked by name
    const a = ACHIEVEMENTS[+e.target.dataset.id], n = String(new FormData(e.target).get("who") || "").trim(), msg = m => { document.getElementById("achgive-msg").textContent = m; };
    if (!a) return;
    const key = achKind(a) === "team" ? (tm => tm && `t:${tm.id}`)(allTeams().find(tm => tm.name === n)) : roster().find(p => p.name === n)?.name;
    if (!key) return msg(t("achWhoBad"));
    AWARDS[a[1]] = [...new Set([...(AWARDS[a[1]] || []), key])]; toast(t("achGiven"));
    return dbSave();
  }
  if (e.target.id === "rosterreq" || e.target.id === "namereq") {
    const f = e.target, fd = new FormData(f), tm = teamById(S.team), msg = m => { document.getElementById(`${f.id}-msg`).textContent = m; };
    if (!isFounder(tm)) return;
    const req = f.id === "namereq"
      ? { type: "name", oldName: tm.name, newName: String(fd.get("name") || "").trim().slice(0, 32) }
      : { type: "roster", tour: +f.dataset.tour, reason: String(fd.get("reason") || "").trim().slice(0, 200), out: String(fd.get("out") || ""), in: String(fd.get("in") || "").trim().slice(0, 32) };
    if (req.type === "name" && (!req.newName || req.newName === tm.name)) return msg(t("nameNeed"));
    if (req.type === "roster" && (!req.reason || (!req.out && !req.in))) return msg(t("reqNeed"));
    toast(t("reqSent"));
    return addReq(tm, { id: Date.now(), at: Date.now(), ...req });
  }
  if (e.target.id === "teamform") {
    const name = document.getElementById("tname").value.trim().slice(0, 32), tag = document.getElementById("ttag").value.trim().toUpperCase().slice(0, 4);
    if (!name || !tag) { teamMsg = t("nameBad"); return render(); }
    if (HOSTED) { // the server creates the team; one created team per pilot
      if (SRV_TEAMS.some(z => z.creator === S.user?.steamId)) { teamMsg = t("createdKeep"); return render(); }
      api("/api/team/create", { method: "POST", body: JSON.stringify({ name, tag }) }).then(r => { SRV_TEAMS.push(r.team); S.team = r.team.id; teamMsg = ""; apiV = null; save(); },
        e => { teamMsg = e.message === "409" ? t("createdKeep") : t("netErr"); render(); });
      return;
    }
    if (S.created) { teamMsg = t("createdKeep"); return render(); } // the team you created still exists under another founder
    S.created = { name, tag, desc: "" }; S.team = OWN_TEAM; teamMsg = "";
    save();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "log-q") { logQ = e.target.value; const q = logQ.trim().toLowerCase();
    document.querySelectorAll(".log-tbl tbody tr").forEach(tr => { tr.hidden = !!q && !tr.textContent.toLowerCase().includes(q); }); return; }
  if (e.target.id === "invq") { const q = e.target.value.trim().toLowerCase(); let n = 0;
    document.querySelectorAll("#invlist li").forEach(li => { const on = li.dataset.q.includes(q); li.hidden = !on; n += on; });
    document.getElementById("invnone").hidden = n > 0; return; }
  // update in place so the field keeps focus
  if (e.target.id === "rule-ta") { const pv = document.getElementById("rule-prev"); if (pv) pv.innerHTML = textToHtml(e.target.value); return; }
  // achievement icon: a pasted (Ctrl+V) or picked emoji applies at once, no need to leave the field
  if (e.target.classList?.contains("ach-ic-in") && /\p{Extended_Pictographic}|\p{Regional_Indicator}/u.test(e.target.value)) { e.target.dispatchEvent(new Event("change", { bubbles: true })); return; }
  if (e.target.closest?.(".bc-size")) { e.target.nextElementSibling.textContent = e.target.value + "%"; return; } // saved on release (change)
  if (e.target.id === "accq") { accessQuery = e.target.value; document.getElementById("acc-body").innerHTML = accessRows(); }
  if (e.target.id === "search") { query = e.target.value; const el = document.getElementById("rlist"); if (el) el.innerHTML = rRows(); }
  if (e.target.dataset.about) {
    const key = e.target.dataset.about === "en" ? "en" : "ru";
    S.about = { ...S.about, [key]: e.target.value.slice(0, ABOUT_MAX) }; persist();
    document.getElementById("cnt-" + key).textContent = `${S.about[key].length} / ${ABOUT_MAX}`;
  }
  if (e.target.id === "teamdesc" && (isFounder(teamById(S.team)) || isRep(teamById(S.team)))) {
    // a created team keeps its description in the founder's profile, a league team in the league data
    const ref = myTeamRef(); if (!ref) return;
    ref.desc = e.target.value.slice(0, 300); isSrv(ref) ? teamPutSoon(ref) : S.team === OWN_TEAM ? persist() : dbSave(false);
    document.getElementById("desccount").textContent = `${ref.desc.length} / 300`;
  }
});
document.addEventListener("toggle", e => { if (e.target.id === "ach-box") { S.achOpen = e.target.open; persist(); }
  if (e.target.dataset?.tocg != null) e.target.open ? tocOpenG.add(+e.target.dataset.tocg) : tocOpenG.delete(+e.target.dataset.tocg);
  if (e.target.dataset?.rdoc != null) e.target.open ? rClosed.delete(+e.target.dataset.rdoc) : rClosed.add(+e.target.dataset.rdoc);
  if (e.target.dataset?.topen) tOpen[e.target.dataset.topen] = e.target.open; }, true);
document.addEventListener("change", e => {
  if (e.target.id === "teamlogo") return setTeamLogo(e.target.files?.[0]);
  if (e.target.id === "teamfounder") { passTo = e.target.value; pending = null; return; } // remembered: the confirm click redraws the block
  if (e.target.id === "teamrep") { const tm = teamById(S.team), ref = myTeamRef(), v = e.target.value;
    if (!isFounder(tm) || !ref || (v && !membersOf(tm).some(p => p.name === v))) return;
    if (v) ref.rep = v; else delete ref.rep; toast(t("saved")); return saveTeam(); }
  if (e.target.dataset.dc && isAdmin() && DC) { const [k, f] = e.target.dataset.dc.split(":"), v = e.target.type === "checkbox" ? e.target.checked : e.target.value.trim();
    if (k === "name") { DC.name = v.slice(0, 80); return dcSave(); }
    DC[k] = { ...DC[k], ...(f === "on" ? { off: !v } : f === "ping" ? { ping: v } : f === "color" ? { color: v } : { [f]: v.slice(0, { text: 1500, title: 100, link: 40 }[f] || 40) }) }; return dcSave(); }
  if (e.target.dataset.dcimg && isAdmin() && DC) { const k = e.target.dataset.dcimg, f = e.target.files?.[0];
    return f && readBanner(f, blob => dcImgSend(k, blob), big => toast(t(big ? "dcImgBig" : "logoBad"))); }
  if (e.target.dataset.swap) { swapSel[e.target.dataset.swap] = e.target.value; return; }
  if (e.target.matches?.("[data-rimg]") && can("rules")) { const f = e.target.files?.[0], ta = document.getElementById("rule-ta"); e.target.value = "";
    const put = id => { if (!ta) return; const a = ta.selectionStart, ls = ta.value.lastIndexOf("\n", a - 1) + 1, le = (ta.value.indexOf("\n", a) + 1 || ta.value.length + 1) - 1, line = ta.value.slice(ls, le);
      if (/^!img(\s+[\w-]{1,40})+$/.test(line.trim())) ta.setRangeText(`${line.trimEnd()} ${id}`, ls, le, "end");
      else ta.setRangeText(`${a > 0 && ta.value[a - 1] !== "\n" ? "\n" : ""}!img ${id}\n`, a, a, "end");
      ta.focus(); ta.dispatchEvent(new Event("input", { bubbles: true })); ta.dispatchEvent(new Event("change", { bubbles: true })); };
    return f && readBanner(f, blob => {
      if (!HOSTED) { const r = new FileReader(); r.onload = () => { const id = "d" + Date.now().toString(36); RULE_IMGS[id] = r.result; put(id); }; return r.readAsDataURL(blob); }
      fetch(`${API}/api/rules/img`, { method: "POST", headers: { authorization: "Bearer " + token, "content-type": blob.type }, body: blob })
        .then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status)))).then(r => put(r.id), e => toast(t(e.message === "413" ? "dcImgBig" : "netErr")));
    }, big => toast(t(big ? "dcImgBig" : "logoBad"))); }
  if (e.target.dataset.splogo && isAdmin()) { const s = SPONSORS[+e.target.dataset.splogo], f = e.target.files?.[0];
    return s && f && readLogo(f, data => { s.img = data; dbSave(); toast(t("saved")); }, () => toast(t("logoBad")), true); }
  const k = e.target.dataset.car, a = e.target.dataset.a;
  if (k === "hp" || k === "kg") { const n = Math.round(Number(e.target.value)); S.car[k] = e.target.value === "" || !Number.isFinite(n) ? "" : String(Math.min(SETTINGS[k + "Max"], Math.max(SETTINGS[k + "Min"], n))); save(); }
  else if (k) { S.car[k] = e.target.value.slice(0, 40); save(); }
  if (a && canEdit(a.split(":")[0])) { adminEdit(a.split(":"), e.target.type === "checkbox" ? e.target.checked : e.target.value); if (!adminMsg) toast(t("saved")); }
});
// the mouse wheel over a focused number field scrolls the page instead of changing a score
document.addEventListener("wheel", e => { if (e.target.matches?.("input[type=number]") && e.target === document.activeElement) e.target.blur(); }, { passive: true });
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches?.("tr[data-qt], tr[data-season]")) e.target.click();

});

// background: a quiet lava lamp — a few warm blobs rise, sink and merge (metaballs on a small canvas, scaled up and softened);
// ~25 fps, paused when hidden or on OBS pages, one still frame with reduced motion
(() => {
  const cv = document.getElementById("lava"), cx = cv?.getContext("2d");
  if (!cx) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches, K = 8; // one canvas pixel per 8 screen pixels
  const blobs = Array.from({ length: 6 }, (_, i) => ({ x: .1 + i / 5 * .8 + (Math.random() - .5) * .06, r: .11 + Math.random() * .07,
    sp: .02 + Math.random() * .022, ph: Math.random() * 6.28, sx: .25 + Math.random() * .35 }));
  let W = 0, H = 0, img = null, last = 0;
  const fit = () => { W = cv.width = Math.max(1, Math.ceil(innerWidth / K)); H = cv.height = Math.max(1, Math.ceil(innerHeight / K)); img = cx.createImageData(W, H); };
  const draw = now => {
    const t = now / 1000, d = img.data, A = W / H, sc = Math.min(1, A * .8); // narrow screens get smaller wax
    // each blob travels the full height and a little beyond, like wax in a lamp; radius breathes slightly
    const bs = blobs.map(b => ({ x: (b.x + Math.sin(t * b.sp * 1.7 + b.ph) * .05) * A, y: .5 + .62 * Math.sin(t * b.sp + b.ph), r2: (b.r * sc * (1 + .15 * Math.sin(t * b.sx + b.ph))) ** 2 }));
    for (let py = 0, o = 0; py < H; py++) {
      const y = py / H;
      for (let px = 0; px < W; px++, o += 4) {
        const x = px / H;
        let f = 0;
        for (const b of bs) { const dx = x - b.x, dy = y - b.y; f += b.r2 / (dx * dx + dy * dy + 1e-4); }
        const a = Math.min(1, Math.max(0, (f - .9) / .22)), core = Math.min(1, Math.max(0, (f - 1.1) / 3)); // soft edge, brighter middle
        d[o] = 150 + 105 * core; d[o + 1] = 32 + 72 * core; d[o + 2] = 10 * core; d[o + 3] = a * 255;
      }
    }
    cx.putImageData(img, 0, 0);
  };
  fit();
  addEventListener("resize", () => { fit(); if (still) draw(30000); });
  document.documentElement.classList.add("has-lava");
  if (still) return draw(30000);
  const loop = now => {
    requestAnimationFrame(loop);
    if (document.hidden || document.body.classList.contains("obs") || now - last < 40) return;
    last = now; draw(now);
  };
  requestAnimationFrame(loop);
})();
