  const s = SEASONS.find(z => z.id === aSeason);
  if (!s) return `<div class="head"><h2>${t("seasons")}</h2><button class="btn" data-act="newSeason">${t("newSeason")}</button></div>
    <div class="tablebox panel"><table><thead><tr><th>${t("no")}</th><th>${t("seasonNameCol")}</th><th>${t("stagesCol")}</th><th>${t("status")}</th><th></th></tr></thead><tbody>${
      SEASONS.map(z => `<tr class="clickrow" data-season="${z.id}" tabindex="0"><td class="mono">${z.id}</td><td>${esc(z.name)}</td><td class="mono">${seasonTours(z.id).length}</td><td>${seasonPill(z.status)}</td>
        <td class="acc" style="text-align:right">${t("configure")} →</td></tr>`).join("")}</tbody></table></div>`;
  const x = TOURS.find(z => z.id === aTour && z.season === s.id);
  if (x) return adminTour(x);
  const stages = seasonTours(s.id);
  return `${backBtn('data-season="0"', t("seasons"))}
    <div class="head"><h2>${esc(s.name)}</h2>${seasonPill(s.status)}</div>
    <div class="box panel"><div class="cols" style="gap:1rem">
      <label class="fieldlabel">${t("seasonNameCol")}<input class="field" data-a="season:${s.id}:name" value="${esc(s.name)}" maxlength="40"></label>
      <label class="fieldlabel">${t("status")}${sel(`season:${s.id}:status`, ["plan", "live", "done"], s.status, t("status"), "field")}</label></div></div>
    <div class="head"><h3>${t("aStagesOf")}</h3>${stages.length < 12 ? `<button class="btn line sm" data-act="addStage" data-id="${s.id}">${t("addStage")}</button>` : ""}</div>
    <div class="tablebox panel"><table><thead><tr><th>${t("stage")}</th><th>${t("track")}</th><th>${t("dates")}</th><th>${t("status")}</th><th>${t("drivers")}</th><th></th></tr></thead><tbody>${
      stages.map(z => `<tr class="clickrow" data-qt="${z.id}" tabindex="0"><td class="n">${z.stage}</td><td>${esc(z.track)}</td><td class="mono muted">${esc(z.dates)}</td><td>${tourPill(z)}</td>
        <td class="mono muted">${stageRows(z).length}</td><td class="acc" style="text-align:right">${t("configure")} →</td></tr>`).join("")}</tbody></table></div>
    <div>${s.status === "live" ? `<p class="note">${t("liveLocked")}</p>` : `<button class="btn text danger" data-act="delSeason" data-id="${s.id}">${pending === `s${s.id}` ? t("delSure") : t("delSeason")}</button>`}</div>`;
}

function adminTour(x) {
  const sub = (k, l) => `<button data-sub="${k}" aria-pressed="${aSub === k}">${t(l)}</button>`;
  const head = `${backBtn('data-qt="0"', esc(seasonName(x.season)))}
    <div class="head"><h2>${t("stage")} ${x.stage} · ${esc(x.track)}</h2>${tourPill(x)}</div>
    <div class="tabs">${sub("main", "aMain")}${sub("judge", "aJudge")}${sub("qual", "aQual")}${sub("pilots", "aPilots")}${sub("teams", "aTeams")}</div>`;
  let body = "";
  if (aSub === "judge") body = judgeIsland(x);
  if (aSub === "main") body = `<div class="box panel"><div class="cols" style="gap:1rem">
      <label class="fieldlabel">${t("track")}<input class="field" data-a="tour:${x.id}:track" value="${esc(x.track)}" maxlength="40"></label>
      <label class="fieldlabel">${t("dates")}<input class="field" data-a="tour:${x.id}:dates" value="${esc(x.dates)}" maxlength="40"></label>
      <label class="fieldlabel">${t("startAt")}<input class="field" data-a="tour:${x.id}:start" value="${esc(x.start)}" maxlength="40"></label>
</div></div>
    <div class="box panel"><h3>${t("stageStatus")}</h3>${stepper(x)}</div>
    <div><button class="btn text danger" data-act="delStage" data-id="${x.id}">${pending === `st${x.id}` ? t("delSure") : t("delStage")}</button></div>`;
  if (aSub === "qual") {
    const inp = (p, i, k) => { const v = scoreOf(x, p, i, k); return `<input class="ai" type="number" min="0" max="100" step="0.1" data-a="score:${x.id}:${k}:${i}" value="${v ?? ""}" aria-label="${esc(p.name)} ${k + 1}">`; };
    body = `<p class="note">${t("qualHint")}</p><div class="tablebox panel"><table><thead><tr><th>${t("no")}</th><th>${t("pilot")}</th><th>${t("try1")}</th><th>${t("try2")}</th></tr></thead><tbody>${
      stageRows(x).map(([p, i]) => `<tr><td class="n">${p.num ?? "—"}</td><td>${esc(p.name)}</td><td>${inp(p, i, 0)}</td><td>${inp(p, i, 1)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  if (aSub === "pilots") { const inRows = new Set(stageRows(x).map(([p]) => p.name)), gm = gmaxOf(x);
    body = `<div class="box panel"><div class="stack" style="gap:.3rem"><h3>${t("groupLimits")}</h3><p class="note" style="margin:0">${t("groupsHint")}</p></div>
      <div class="grp-limits">${GROUPS.map(g => `<label class="fieldlabel"><span><span class="grp">${g}</span> ${groupCount(x, g)} / ${gm[g]}</span><input class="field" type="number" min="1" max="64" data-a="gmax:${x.id}:${g}" value="${gm[g]}" aria-label="${t("group")} ${g}"></label>`).join("")}</div></div>
    <p class="note">${t("pilotsHint")}</p><div class="tablebox panel"><table><thead><tr><th>${t("inStage")}</th><th>${t("no")}</th><th>${t("pilot")}</th><th>${t("team")}</th><th>${t("group")}</th></tr></thead><tbody>${
    roster().map((p, i) => `<tr><td><input type="checkbox" data-a="out:${x.id}:${i}" ${inRows.has(p.name) ? "checked" : ""} aria-label="${t("inStage")}: ${esc(p.name)}"></td>
      <td class="n">${p.num ?? "—"}</td><td>${esc(p.name)}${p.test ? ` <span class="label">${t("testTag")}</span>` : ""}${isBanned(p.name) ? ` <span class="pill plain err" style="font-size:.65rem">${t("ban")}</span>` : ""}</td><td class="muted">${teamById(p.team) ? esc(teamById(p.team).name) : "—"}</td>
      <td><select class="ai" data-a="grp:${x.id}:${i}" ${inRows.has(p.name) ? "" : "disabled"} aria-label="${t("group")} ${esc(p.name)}"><option value="">—</option>${GROUPS.map(g => `<option ${groupOf(x, p.name) === g ? "selected" : ""}>${g}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>`; }
  if (aSub === "teams") body = `<p class="note">${t("teamsHint")}</p><div class="tablebox panel"><table><thead><tr><th>${t("teamScore")}</th><th></th><th>${t("team")}</th><th>${t("onStage")}</th></tr></thead><tbody>${
    allTeams().map(tm => `<tr><td><input type="checkbox" data-a="tout:${x.id}:${tm.id}" ${x.teamsOut.includes(tm.id) ? "" : "checked"} aria-label="${t("teamScore")}: ${esc(tm.name)}"></td>
      <td>${logo(tm)}</td><td>${esc(tm.name)}</td><td class="mono muted">${stageRows(x).filter(([p]) => p.team === tm.id).length}/${maxTeam()}</td></tr>`).join("")}</tbody></table></div>`;
  return head + body;
}

      <button class="btn line" data-act="addTest">${t("addTestPilot")}</button></div>
    <div class="tablebox panel"><table><thead><tr><th>${t("numCol")}</th><th>${t("pilot")}</th><th>${t("sanctions")}</th><th></th></tr></thead><tbody>${roster().map((p, i) => {
      const key = p.mine ? "me" : i, kickKey = `kick-${p.name}`;
      const extra = p.test ? `<button class="btn text danger sm" data-act="delTest" data-name="${esc(p.name)}">${pending === kickKey ? t("delSure") : t("del")}</button>`

        <td><div class="row" style="flex-wrap:nowrap;gap:.35rem"><select class="ai" id="sanc-${i}" aria-label="${t("sanctions")} ${esc(p.name)}">${["warn", "dq", "ban"].map(s => `<option value="${s}">${t(s)}</option>`).join("")}</select>

function admin() {
  if (!isAdmin()) return `<div class="box panel empty"><p class="muted">${S.user ? t("adminOnly") : t("loginFirst")}</p><div><a class="btn line" href="#profile">${t("profile")} →</a></div></div>`;
  const item = (k, l, badge) => `<button data-tab="${k}" aria-pressed="${aTab === k}">${t(l)}${badge ? `<span class="badge">${badge}</span>` : ""}</button>`;
  const view = { seasons: adminSeasons, pilots: adminPilots, teams: adminTeams, sponsors: adminSponsors, ach: adminAch, rules: adminRules, access: adminAccess, settings: adminSettings }[aTab] || adminSeasons;
  return `<div class="adm">
    <aside class="adm-side"><span class="label acc">${t("adminPanel")}</span>
      ${item("seasons", "aSeasons")}${item("pilots", "aSanctions")}${item("teams", "aTeams")}${item("sponsors", "aSponsors")}${item("ach", "achievements")}${item("rules", "aRules")}${item("access", "aAccess")}${item("settings", "aSettings")}
      <a class="bc-link" href="#broadcast">${t("broadcastBtn")}</a></aside>

}

function adminEdit([kind, id, f, k], v) {
  adminMsg = "";
  if (kind === "tour") {
    const x = TOURS.find(z => z.id === +id);
    if (f === "status") { if (STATUSES.includes(v)) x.status = v; }
    else x[f] = v.trim().slice(0, 40) || x[f];
    return dbSave();
  }
  if (kind === "season") {
    const s = SEASONS.find(z => z.id === +id);
    if (f === "name") s.name = v.trim().slice(0, 40) || s.name;
    if (f === "status" && ["plan", "live", "done"].includes(v)) {
      if (v === "live") SEASONS.forEach(z => { if (z.status === "live") z.status = "done"; }); // one running season at a time
      s.status = v;
    }
    return dbSave();
  }
  if (kind === "out") {
    // checked = takes part: un-exclude, and enter by hand when the pilot didn't register; unchecked = excluded
    const x = TOURS.find(z => z.id === +id), name = roster()[+f]?.name;
    if (!x || !name) return;
    const drop = l => { const at = l.indexOf(name); if (at >= 0) l.splice(at, 1); };
    x.add ??= [];
    if (v) { drop(x.out); if (!stageRows(x).some(([p]) => p.name === name)) x.add.push(name); }
    else { drop(x.add); x.out.push(name); }
    return dbSave();
  }
  if (kind === "grp") {
    const x = TOURS.find(z => z.id === +id), name = roster()[+f]?.name;
    if (!x || !name || (v && !GROUPS.includes(v))) return;
    if (v && v !== groupOf(x, name) && groupCount(x, v) >= gmaxOf(x)[v]) { adminMsg = t("groupFull"); return render(); }
    x.groups = { ...x.groups };
    if (v) x.groups[name] = v; else delete x.groups[name];
    return dbSave();
  }
  if (kind === "gmax") {
    const x = TOURS.find(z => z.id === +id), n = Math.round(Number(v));
    if (!x || !GROUPS.includes(f) || !(n >= 1 && n <= 64)) return render();
    x.gmax = { ...x.gmax, [f]: n };
    return dbSave();
  }
  if (kind === "tout") {
    // checkbox checked = takes part; unchecked = listed in out / teamsOut
    const x = TOURS.find(z => z.id === +id), list = kind === "out" ? x.out : x.teamsOut, key = kind === "out" ? roster()[+f]?.name : +f;
    if (key == null) return;
    const at = list.indexOf(key);
    if (v && at >= 0) list.splice(at, 1);
    if (!v && at < 0) list.push(key);
    return dbSave();
  }
  if (kind === "jscore") {
    // a score typed in the judges island puts that stage and that pilot on air
    const b = bcState(), tid = +id;
    if ((b.tour ?? bcTour(b)?.id) !== tid) Object.assign(b, { onTrack: null, leader: null, chaser: null, label: "", votes: [null, null, null] });
    S.bc = { ...b, tour: tid, onTrack: b.onTrack || roster()[+k]?.name || null };
    kind = "score";
  }
  if (kind === "score") {
    // data-a = score:tourId:run:rosterIndex
    const p = roster()[+k], n = Number(v);
    if (!p) return;
    if (v !== "" && !Number.isFinite(n)) return render();
    (S.scores[`${id}:${p.name}`] ??= {})[f] = v === "" ? null : Math.min(100, Math.max(0, Math.round(n * 10) / 10));
    return save();
  }
  if (kind === "pilot") {
    const idx = id === "me" ? -1 : +id, p = PILOTS[idx], n = Number(v);
    if (!p?.test && !isOwner()) return render(); // real pilots' numbers: head admin only
    if (f === "rating") {
      if (v === "" || !Number.isFinite(n)) return render();
      const r = Math.min(100, Math.max(0, Math.round(n)));
      if (p) p.rating = r; else S.myRating = r;
    }
    if (f === "num") {
      const used = new Set([...PILOTS.filter((_, i) => i !== idx).map(q => q.num), ...(idx !== -1 && S.num ? [S.num] : [])]);
      if (!Number.isInteger(n) || n < 1 || n > 999) { adminMsg = t("numBad"); return render(); }
      if (used.has(n)) { adminMsg = `${t("numDup")}: ${n}`; return render(); }
      if (p && HOSTED && !p.test) { ownerCall({ sid: p.steamId, num: n }); return render(); }
      if (p) p.num = n; else S.num = n;
    }
    return dbSave();
  }
  if (kind === "team") {
    const d = v.slice(0, 300);
    if (+id === OWN_TEAM) S.created.desc = d; else TEAMS.find(x => x.id === +id).desc = d;
    return dbSave(false);
  }
  if (kind === "ach") {
    const a = ACHIEVEMENTS[+id], val = v.trim();
    if (!a) return;
    if (f === "ic") a[0] = val.slice(0, 8) || a[0];
    else if (f === "ruT") a[2][0] = val.slice(0, 40) || a[2][0];
    else if (f === "ruD") a[2][1] = val.slice(0, 120);
    else if (f === "enT") a[3][0] = val.slice(0, 40);
    else if (f === "enD") a[3][1] = val.slice(0, 120);
    return dbSave();
  }
  if (kind === "sponsor") {
    const s = SPONSORS[+id];
    if (!s) return;
    if (f === "role" && ["general", "partner"].includes(v)) {
      if (v === "general") SPONSORS.forEach(z => { if (z.role === "general") z.role = "partner"; }); // one title sponsor
      s.role = v;
    } else if (f === "name") s.name = v.trim().slice(0, 40) || s.name;
    else if (f === "url") s.url = v.trim().slice(0, 120);
    return dbSave();
  }
  if (kind === "protest") {
    const p = PROTESTS.find(z => z.id === +id);
    if (f === "status" && ["new", "accepted", "rejected"].includes(v)) { p.status = v; return dbSave(); }
    if (f === "verdict") { p.verdict = v.slice(0, 500); return dbSave(false); }
  }
  if (kind === "setting") {
    if (id === "regOpen") SETTINGS.regOpen = !!v;
    if (id === "maxTeam") { const n = Math.round(Number(v)); if (n >= 1 && n <= 8) SETTINGS.maxTeam = n; }
    if (id === "hpMin" || id === "hpMax") { const n = Math.round(Number(v)), lo = id === "hpMin" ? n : SETTINGS.hpMin, hi = id === "hpMax" ? n : SETTINGS.hpMax;
      if (n >= 50 && n <= 3000 && lo < hi) SETTINGS[id] = n; else adminMsg = t("hpBad"); }
    if (id === "maxStage") { const n = Math.round(Number(v)); if (n >= 2 && n <= 256) SETTINGS.maxStage = n; }
    return dbSave();
  }
  if (kind === "social" && SETTINGS.socials[id] !== undefined) {
    const u = v.trim().slice(0, 120);

      x.invites = (x.invites || []).filter(n => n !== S.user.name);
      if (membersOf(x).length >= maxTeam()) { teamMsg = t("full"); return dbSave(); }
      S.team = id; dbSave(); },
    declineInvite: () => { const x = teamById(id); if (!x || !S.user) return; if (HOSTED) { S.declined = [...new Set([...(S.declined || []), id])]; return save(); } x.invites = (x.invites || []).filter(n => n !== S.user.name); dbSave(); },
    leave: () => { if (S.team === OWN_TEAM) S.created = null; S.team = null; save(); },
  })[el.dataset.act]?.();
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "numform") {
    const v = Number(document.getElementById("own").value);
    const err = !Number.isInteger(v) || v < 1 || v > 999 ? t("numBad") : taken().has(v) ? t("numTaken") : "";
    if (err) document.getElementById("nummsg").textContent = err;
    else { pick = v; confirmNum(); }
  }
  if (e.target.id === "protestform" && S.user) {
    const text = document.getElementById("ptext").value.trim().slice(0, 500), against = document.getElementById("pagainst").value, x = TOURS.find(z => z.id === +e.target.dataset.tour);
    if (!text || !against || !x || !protestOpen(x)) return;
    if (myProtests(x).some(q => q.against === against && q.status === "new")) { protestMsg = t("protestDup"); return render(); }
    protestMsg = t("protestSent");
    if (HOSTED && !isAdmin()) { api("/api/protest", { method: "POST", body: JSON.stringify({ tour: +e.target.dataset.tour, against, text }) }).then(() => { apiV = null; }, () => toast(t("netErr"))); return render(); }
    PROTESTS.push({ id: Math.max(0, ...PROTESTS.map(p => p.id)) + 1, tour: +e.target.dataset.tour, from: S.user.name, against, text, status: "new", verdict: "" });
    dbSave();
  }
  if (e.target.id === "teamform") {
    const name = document.getElementById("tname").value.trim().slice(0, 32), tag = document.getElementById("ttag").value.trim().toUpperCase().slice(0, 4);
    if (!name || !tag) { teamMsg = t("nameBad"); return render(); }
    S.created = { name, tag, desc: "" }; S.team = OWN_TEAM; teamMsg = "";
    save();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "invq") { const q = e.target.value.trim().toLowerCase(); let n = 0;
    document.querySelectorAll("#invlist li").forEach(li => { const on = li.dataset.q.includes(q); li.hidden = !on; n += on; });
    document.getElementById("invnone").hidden = n > 0; return; }
  // update in place so the field keeps focus
  if (e.target.id === "accq") { accessQuery = e.target.value; document.getElementById("acc-body").innerHTML = accessRows(); }
  if (e.target.id === "search") { query = e.target.value; const el = document.getElementById("rlist"); if (el) el.innerHTML = rRows(); }
  if (e.target.dataset.about) {
    const key = e.target.dataset.about === "en" ? "en" : "ru";
    S.about = { ...S.about, [key]: e.target.value.slice(0, ABOUT_MAX) }; persist();
    document.getElementById("cnt-" + key).textContent = `${S.about[key].length} / ${ABOUT_MAX}`;
  }
  if (e.target.id === "teamdesc" && S.created) {
    S.created.desc = e.target.value.slice(0, 300); persist();
    document.getElementById("desccount").textContent = `${S.created.desc.length} / 300`;
  }
});
document.addEventListener("toggle", e => { if (e.target.id === "ach-box") { S.achOpen = e.target.open; persist(); } }, true);
document.addEventListener("change", e => {
  if (e.target.id === "teamlogo") return setTeamLogo(e.target.files?.[0]);
  const k = e.target.dataset.car, a = e.target.dataset.a;
  if (k === "hp") { const n = Math.round(Number(e.target.value)); S.car.hp = e.target.value === "" || !Number.isFinite(n) ? "" : String(Math.min(SETTINGS.hpMax, Math.max(SETTINGS.hpMin, n))); save(); }
  else if (k) { S.car[k] = e.target.value.slice(0, 40); save(); }
  if (a && isAdmin()) { adminEdit(a.split(":"), e.target.type === "checkbox" ? e.target.checked : e.target.value); if (!adminMsg) toast(t("saved")); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches?.("tr[data-qt], tr[data-season]")) e.target.click();
});

// background: a quiet lava lamp — a few warm blobs rise, sink and merge (metaballs on a small canvas, scaled up and softened);
// ~25 fps, paused when hidden or on OBS pages, one still frame with reduced motion
(() => {
  const cv = document.getElementById("lava"), cx = cv?.getContext("2d");
  if (!cx) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches, K = 8; // one canvas pixel per 8 screen pixels
  const blobs = Array.from({ length: 6 }, (_, i) => ({ x: .1 + i / 5 * .8 + (Math.random() - .5) * .06, r: .11 + Math.random() * .07,
    sp: .02 + Math.random() * .022, ph: Math.random() * 6.28, sx: .25 + Math.random() * .35 }));
  let W = 0, H = 0, img = null, last = 0;
  const fit = () => { W = cv.width = Math.max(1, Math.ceil(innerWidth / K)); H = cv.height = Math.max(1, Math.ceil(innerHeight / K)); img = cx.createImageData(W, H); };
  const draw = now => {
    const t = now / 1000, d = img.data, A = W / H, sc = Math.min(1, A * .8); // narrow screens get smaller wax
    // each blob travels the full height and a little beyond, like wax in a lamp; radius breathes slightly
    const bs = blobs.map(b => ({ x: (b.x + Math.sin(t * b.sp * 1.7 + b.ph) * .05) * A, y: .5 + .62 * Math.sin(t * b.sp + b.ph), r2: (b.r * sc * (1 + .15 * Math.sin(t * b.sx + b.ph))) ** 2 }));
    for (let py = 0, o = 0; py < H; py++) {
      const y = py / H;
      for (let px = 0; px < W; px++, o += 4) {
        const x = px / H;
        let f = 0;
        for (const b of bs) { const dx = x - b.x, dy = y - b.y; f += b.r2 / (dx * dx + dy * dy + 1e-4); }
        const a = Math.min(1, Math.max(0, (f - .9) / .22)), core = Math.min(1, Math.max(0, (f - 1.1) / 3)); // soft edge, brighter middle
        d[o] = 150 + 105 * core; d[o + 1] = 32 + 72 * core; d[o + 2] = 10 * core; d[o + 3] = a * 255;
      }
    }
    cx.putImageData(img, 0, 0);
  };
  fit();
  addEventListener("resize", () => { fit(); if (still) draw(30000); });
  document.documentElement.classList.add("has-lava");
  if (still) return draw(30000);
  const loop = now => {
    requestAnimationFrame(loop);
    if (document.hidden || document.body.classList.contains("obs") || now - last < 40) return;
    last = now; draw(now);
  };
  requestAnimationFrame(loop);
})();


addEventListener("hashchange", () => { pending = null; protestMsg = ""; render(true); scrollTo(0, 0); });
render(true);
